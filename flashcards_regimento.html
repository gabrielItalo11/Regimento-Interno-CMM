{a:"Art. 56, §2º",t:"Na sede da Câmara não se realizarão atividades estranhas às suas finalidades, sendo restrito o uso do Plenário para as sessões regimentais, devendo outras atividades que demandem uso do recinto do Plenário ser, obrigatoriamente, autorizadas previamente pela Presidência.",c:"As atividades que demandem uso do recinto do Plenário devem ser autorizadas previamente pela Presidência.",e:[["As atividades que demandem uso do recinto do Plenário devem ser autorizadas previamente pela Mesa Diretora.","A autorização é da Presidência."]]},
{a:"Art. 57, caput",t:"Nos dias de sessões, somente os Vereadores, desde que convenientemente trajados, poderão permanecer no recinto do Plenário. §1º A critério do Presidente, serão convocados os funcionários necessários ao andamento dos trabalhos.",c:"Nos dias de sessões, somente os Vereadores, convenientemente trajados, podem permanecer no recinto do Plenário.",e:[["Nos dias de sessões, os Vereadores e os servidores da Câmara podem permanecer livremente no recinto do Plenário.","Só os Vereadores; funcionários são convocados a critério do Presidente."]]},
{a:"Art. 57, §§2º a 4º",t:"A convite da Presidência, por iniciativa própria ou sugestão de qualquer Vereador, poderão assistir aos trabalhos, no recinto do Plenário, autoridades, personalidades homenageadas e representantes credenciados da imprensa. A saudação oficial ao visitante será feita pelo Vereador que o Presidente designar. Os visitantes poderão, a critério da Presidência e pelo tempo por esta determinado, discursar para agradecer a saudação.",c:"A saudação oficial ao visitante é feita, em nome da Câmara, pelo Vereador que o Presidente designar.",e:[["A saudação oficial ao visitante é feita pelo 1º Secretário.","É feita pelo Vereador que o Presidente designar."],["Os visitantes têm direito a discursar por dez minutos para agradecer a saudação.","Discursam a critério da Presidência, pelo tempo que ela determinar."]]},
{a:"Art. 58, caput e §1º",t:"Os vereadores serão agrupados por representações partidárias, blocos parlamentares e bancadas de situação e oposição, cabendo-lhes escolher o Líder. A escolha do líder será comunicada à Mesa Diretora, no início de cada Legislatura, ou após a criação das bancadas de situação e oposição, em documento subscrito pela maioria absoluta dos integrantes da respectiva bancada.",c:"A escolha do líder é comunicada à Mesa em documento subscrito pela maioria absoluta dos integrantes da bancada.",e:[["A escolha do líder é comunicada à Mesa em documento subscrito por 2/3 dos integrantes da bancada.","É maioria absoluta."],["A escolha do líder é comunicada ao Plenário e votada por todos os Vereadores.","A comunicação é à Mesa, com documento subscrito pela bancada."]]},
{a:"Art. 58, §§2º a 4º",t:"Os líderes permanecerão no exercício de liderança até que nova indicação seja feita. Os líderes podem indicar à Mesa Diretora até 2 (dois) vice-líderes, que o substituem. Enquanto não indicado o líder, a Mesa Diretora assim considerará o vereador mais idoso e, em caso desta condição ser comum a mais de um vereador, o mais votado dentre eles.",c:"Enquanto não indicado o líder, a Mesa considera líder o Vereador mais idoso; se a idade for igual, o mais votado.",e:[["Enquanto não indicado o líder, a Mesa considera líder o Vereador mais votado; se houver empate, o mais idoso.","Idade primeiro, depois o mais votado."],["Os líderes podem indicar à Mesa até três vice-líderes.","São até 2 vice-líderes."]]},
{a:"Art. 59",t:"A liderança da bancada de situação e a liderança da bancada de oposição têm as seguintes prerrogativas: I - usar da palavra, em única oportunidade, por tempo não superior a 5 (cinco) minutos, para comunicações urgentes sobre matéria de relevante interesse público ou para defesa da respectiva linha política, no período da Ordem do Dia; II - participar dos trabalhos de qualquer Comissão de que não seja membro, sem direito a voto, mas podendo requerer diligências, levantar questões de ordem e pedir verificação de votação; III - encaminhar a votação de qualquer proposição; IV - indicar à Mesa os membros da Bancada para compor as Comissões; V - participar das Reuniões de Lideranças.",c:"O líder pode participar dos trabalhos de qualquer Comissão de que não seja membro, sem direito a voto, podendo requerer diligências.",e:[["O líder pode participar dos trabalhos de qualquer Comissão de que não seja membro, com direito a voto.","Participa sem direito a voto."],["O líder usa da palavra por até 10 minutos, em única oportunidade, no período do Expediente.","É por até 5 minutos, no período da Ordem do Dia."]]},
{a:"Art. 60",t:"As representações de dois ou mais partidos, por deliberação das respectivas Bancadas, poderão constituir Bloco Parlamentar, sob liderança comum. §2º As lideranças dos partidos que se coligarem em Bloco Parlamentar perdem suas atribuições e prerrogativas regimentais, exceto para indicação dos membros das Comissões. §3º As representações partidárias, blocos e bancadas têm existência limitada à Legislatura.",c:"As lideranças dos partidos que formam um Bloco Parlamentar perdem suas prerrogativas, exceto a de indicar membros das Comissões.",e:[["As lideranças dos partidos que formam um Bloco Parlamentar mantêm todas as prerrogativas regimentais.","Perdem, exceto para indicação dos membros das Comissões."],["Os blocos parlamentares e as bancadas têm existência limitada a dois anos.","A existência é limitada à Legislatura."]]},
{a:"Art. 61",t:"A bancada que, constituindo a Maioria ou Minoria, tenha posição divergente com relação ao Governo, será a Oposição. Seu Líder será o Líder da Oposição.",c:"A bancada que, constituindo a Maioria ou a Minoria, tenha posição divergente em relação ao Governo será a Oposição.",e:[["A bancada que constitua a Minoria será sempre a Oposição, qualquer que seja sua posição em relação ao Governo.","Depende da posição divergente em relação ao Governo."]]},
{a:"Art. 62",t:"O Governo Municipal pode indicar um Vereador para exercer a liderança do Governo, com as prerrogativas constantes do art. 60.",c:"O Governo Municipal pode indicar um Vereador para exercer a liderança do Governo.",e:[["O Plenário elege, por maioria absoluta, o Vereador que exercerá a liderança do Governo.","O Governo Municipal indica."]]},
{a:"Art. 63",t:"Os líderes são os intermediários autorizados para o diálogo entre as Bancadas ou com o Governo e os Órgãos da Câmara.",c:"Os líderes são os intermediários autorizados para o diálogo entre as Bancadas ou com o Governo e os Órgãos da Câmara.",e:[["Os líderes são os intermediários exclusivos entre o Governo e o Presidente da Câmara.","O Art. 63 fala em diálogo entre as Bancadas ou com o Governo e os Órgãos da Câmara."]]},
{a:"Art. 64",t:"O Vereador que se desvincular de sua representação partidária, de seu bloco parlamentar ou de sua Bancada de situação ou oposição perderá, após o encerramento do ano legislativo, para todos os efeitos regimentais, o direito a cargos e funções que ocupar nas Comissões Permanentes.",c:"O Vereador que se desvincular de sua representação perde, após o encerramento do ano legislativo, os cargos que ocupar nas Comissões Permanentes.",e:[["O Vereador que se desvincular de sua representação perde, imediatamente, os cargos que ocupar nas Comissões Permanentes.","A perda ocorre após o encerramento do ano legislativo."],["O Vereador que se desvincular de sua representação perde os cargos que ocupar na Mesa Diretora.","O artigo trata das Comissões Permanentes."]]},
{a:"Art. 65, caput",t:"O Presidente da Câmara Municipal e os Líderes da bancada de situação e bancada de oposição constituem a Reunião de Liderança, competente para deliberar acerca da matéria prevista deste Capítulo.",c:"A Reunião de Liderança é constituída pelo Presidente da Câmara e pelos Líderes da bancada de situação e da bancada de oposição.",e:[["A Reunião de Liderança é constituída pela Mesa Diretora e pelos Líderes de todos os partidos.","É o Presidente e os Líderes de situação e de oposição."]]},
{a:"Art. 65, §§1º a 3º",t:"Os Líderes de Partidos com até dois Vereadores ou de Partidos que participem de Bloco Parlamentar e o Líder do Governo terão direito a voz, mas não a voto na Reunião de Liderança. A Reunião de Lideranças se faz por solicitação direta ao Presidente, por qualquer de seus membros, devendo ser previamente cientificados os demais integrantes. Em virtude de Reunião de Lideranças, a Ordem do Dia não pode ser adiada, suspensa ou prorrogada.",c:"O Líder do Governo tem direito a voz, mas não a voto, na Reunião de Liderança.",e:[["O Líder do Governo tem direito a voz e a voto na Reunião de Liderança.","Tem voz, mas não voto."],["Em virtude de Reunião de Lideranças, a Ordem do Dia pode ser suspensa por até 30 minutos.","A Ordem do Dia não pode ser adiada, suspensa ou prorrogada."]]},
{a:"Art. 66, caput",t:"Compete à Reunião de Liderança: I - opinar sobre a fixação do número de membro de cada Comissão, bem como sobre a representação das Bancadas nas diversas Comissões; II - estabelecer entendimento político entre as bancadas, sem prejuízo da competência legislativa do Plenário e das comissões; III - dispensar exigências e formalidades regimentais para agilizar tramitação das proposições.",c:"Compete à Reunião de Liderança dispensar exigências e formalidades regimentais para agilizar a tramitação das proposições.",e:[["Compete à Reunião de Liderança aprovar proposições em substituição ao Plenário e às Comissões.","Estabelece entendimento político, sem prejuízo da competência legislativa do Plenário e das comissões."]]},
{a:"Art. 66, §4º",t:"A Reunião de Lideranças, ao exercer a competência prevista no inciso III, não poderá dispensar: I - exigências e formalidades decorrentes de imperativo constitucional; II - Parecer oral, em substituição ao das Comissões, pronunciado em Plenário; III - anúncio da inclusão da matéria na pauta da Ordem do Dia com antecedência mínima de um dia, e convocação de sessão extraordinária, com a mesma antecedência.",c:"A Reunião de Lideranças não pode dispensar o anúncio da inclusão da matéria na pauta com antecedência mínima de um dia.",e:[["A Reunião de Lideranças pode dispensar o parecer oral das Comissões, pronunciado em Plenário.","Não pode dispensar o parecer oral em substituição ao das Comissões."],["A Reunião de Lideranças pode dispensar exigências decorrentes de imperativo constitucional, por unanimidade.","Não pode dispensá-las."]]},
{a:"Art. 66, §§5º e 6º",t:"Quando deliberar acerca da matéria prevista no inciso III, as decisões da Reunião de Liderança devem ser tomadas por unanimidade de votos. O Presidente, na primeira oportunidade, comunicará ao Plenário as decisões da Reunião de Lideranças.",c:"As decisões da Reunião de Liderança sobre dispensa de formalidades devem ser tomadas por unanimidade de votos.",e:[["As decisões da Reunião de Liderança sobre dispensa de formalidades são tomadas por maioria absoluta.","Exigem unanimidade."]]}
],
"4A1 · Comissões: disposições gerais e composição (Arts. 67-79)":[
{a:"Art. 67",t:"As Comissões, órgãos internos destinados a estudar, investigar e apresentar conclusões ou sugestões sobre o que for submetido à sua apreciação, serão permanentes ou temporárias.",c:"As Comissões são órgãos internos destinados a estudar, investigar e apresentar conclusões ou sugestões, e são permanentes ou temporárias.",e:[["As Comissões são órgãos internos destinados apenas a emitir parecer, e são permanentes, temporárias ou mistas.","Estudam, investigam e apresentam conclusões ou sugestões, e são permanentes ou temporárias."]]},
{a:"Art. 68",t:"Na constituição de cada Comissão é assegurada, tanto quanto possível, a representação proporcional dos partidos, blocos parlamentares ou das bancadas de situação e oposição, com representação na Câmara Municipal.",c:"Na constituição de cada Comissão é assegurada, tanto quanto possível, a representação proporcional dos partidos, blocos ou bancadas.",e:[["Na constituição de cada Comissão é assegurada, em qualquer caso, a representação proporcional dos partidos, blocos ou bancadas.","A proporcionalidade é assegurada tanto quanto possível."]]},
{a:"Art. 69",t:"A representação dos partidos, blocos ou bancadas será obtida dividindo-se o número de membros da Câmara Municipal pelo número de membros de cada Comissão e o número de Vereadores de cada partido, bloco ou bancada pelo resultado assim alcançado, obtendo-se o quociente partidário.",c:"O quociente partidário obtém-se dividindo o número de membros da Câmara pelo de membros da Comissão e, pelo resultado, o número de Vereadores de cada partido, bloco ou bancada.",e:[["O quociente partidário obtém-se dividindo o número de Vereadores de cada partido pelo número de membros da Câmara.","Divide-se o número de membros da Câmara pelo de membros da Comissão e, pelo resultado, o de Vereadores de cada partido, bloco ou bancada."]]},
{a:"Art. 70",t:"Poderão assessorar os trabalhos das Comissões, desde que devidamente credenciados pelo respectivo Presidente da Comissão, técnicos de reconhecida competência na matéria em exame.",c:"Técnicos de reconhecida competência na matéria podem assessorar os trabalhos das Comissões, se credenciados pelo respectivo Presidente da Comissão.",e:[["Técnicos de reconhecida competência na matéria podem assessorar os trabalhos das Comissões, se credenciados pelo Presidente da Câmara.","O credenciamento é feito pelo Presidente da Comissão."]]},
{a:"Art. 71",t:"As Comissões Permanentes são as que subsistem nas legislaturas e têm por objetivo estudar os assuntos submetidos ao seu exame e sobre eles exarar parecer.",c:"As Comissões Permanentes são as que subsistem nas legislaturas e têm por objetivo estudar os assuntos e sobre eles exarar parecer.",e:[["As Comissões Permanentes extinguem-se com o término de cada legislatura e são reconstituídas na seguinte.","Subsistem nas legislaturas (as Temporárias é que se extinguem com o término da legislatura)."]]},
{a:"Art. 72",t:"As Comissões Permanentes serão constituídas preferencialmente na mesma sessão legislativa em que for eleita a Mesa Diretora da Câmara Municipal, imediatamente após a eleição desta.",c:"As Comissões Permanentes são constituídas preferencialmente na mesma sessão legislativa da eleição da Mesa, imediatamente após esta.",e:[["As Comissões Permanentes são constituídas no prazo de 30 dias após a eleição da Mesa.","Constituem-se preferencialmente na mesma sessão legislativa, imediatamente após a eleição da Mesa."]]},
{a:"Art. 73",t:"Os membros das Comissões Permanentes serão nomeados pelo Presidente da Câmara, por indicação dos líderes de bancada, para um período de 2 (dois) anos, observada a representação proporcional, sempre que possível, sendo permitida a recondução uma vez.",c:"Os membros das Comissões Permanentes são nomeados pelo Presidente da Câmara, por indicação dos líderes, por 2 anos, permitida a recondução uma vez.",e:[["Os membros das Comissões Permanentes são eleitos pelo Plenário, por indicação dos líderes, por 2 anos.","São nomeados pelo Presidente da Câmara; a eleição só ocorre se não houver acordo (Art. 74)."],["Os membros das Comissões Permanentes são nomeados por 2 anos, permitida a recondução sem limite.","A recondução é permitida uma vez."],["Os membros das Comissões Permanentes são nomeados por 4 anos, coincidindo com a legislatura.","O período é de 2 anos."]]},
{a:"Art. 74, caput e §§1º a 3º",t:"Não havendo acordo, proceder-se-á à escolha por eleição, votando cada Vereador em um único nome para cada Comissão, considerando-se eleitos os mais votados, de acordo com o quociente partidário previamente fixado. Proceder-se-á a tantos escrutínios quantos forem necessários. Havendo empate, considerar-se-á eleito o Vereador do Partido, Bloco ou Bancada ainda não representada na Comissão. Persistindo o empate, será considerado eleito o Vereador mais idoso.",c:"Não havendo acordo, cada Vereador vota em um único nome para cada Comissão; no empate, vence o Vereador do partido ainda não representado e, persistindo, o mais idoso.",e:[["Não havendo acordo, cada Vereador vota em tantos nomes quantas forem as vagas da Comissão.","Vota em um único nome para cada Comissão."],["Persistindo o empate na eleição para a Comissão, considera-se eleito o Vereador mais votado na eleição municipal.","Persistindo o empate, é eleito o mais idoso."]]},
{a:"Art. 74, §§4º e 5º",t:"A votação para constituição de cada uma das Comissões Permanentes far-se-á mediante voto nominal, aberto, com indicação do nome do votado e assinada pelo votante. Após a comunicação do resultado em Plenário, o Presidente enviará à publicação a composição nominal de cada Comissão.",c:"A votação para constituição das Comissões Permanentes é por voto nominal, aberto, com indicação do nome do votado e assinada pelo votante.",e:[["A votação para constituição das Comissões Permanentes é por voto secreto, com indicação do nome do votado.","É nominal, aberta e assinada pelo votante."]]},
{a:"Art. 75",t:"O Presidente da Câmara Municipal não poderá fazer parte das Comissões Permanentes. Parágrafo único. O Vice-presidente da Mesa Diretora, no exercício da Presidência, nos casos de impedimento ou licença do Presidente, terá substituto nas Comissões Permanentes a que pertencer, enquanto substituir o Presidente da Mesa.",c:"O Vice-Presidente que exerce a Presidência terá substituto nas Comissões Permanentes a que pertencer, enquanto substituir o Presidente.",e:[["O Vice-Presidente que exerce a Presidência perde definitivamente o cargo nas Comissões Permanentes a que pertencer.","Terá substituto apenas enquanto substituir o Presidente."],["O Presidente da Câmara pode fazer parte das Comissões Permanentes, sem direito a voto.","Não pode fazer parte das Comissões Permanentes."]]},
{a:"Art. 76",t:"Na composição das Comissões Permanentes, figurará o nome do suplente enquanto estiver no exercício da vereança.",c:"Na composição das Comissões Permanentes, figura o nome do suplente enquanto estiver no exercício da vereança.",e:[["Os suplentes de Vereador não podem integrar as Comissões Permanentes.","O suplente figura na composição enquanto estiver no exercício da vereança."]]},
{a:"Art. 77",t:"O preenchimento das vagas ocorridas nas Comissões, nos casos de impedimento, destituição ou renúncia, será apenas para completar o período do mandato.",c:"O preenchimento de vagas nas Comissões, em caso de impedimento, destituição ou renúncia, é apenas para completar o período do mandato.",e:[["O preenchimento de vagas nas Comissões, em caso de destituição ou renúncia, inicia novo período de 2 anos.","É apenas para completar o período do mandato."]]},
{a:"Art. 78",t:"Em caso de mudança de partido, bloco parlamentar ou bancada de situação ou de oposição, o membro integrante da comissão perderá, após o encerramento do ano legislativo, o cargo que ocupa, devendo a vaga ser preenchida por nomeação do Presidente da Câmara, por indicação dos líderes de bancada.",c:"Quem muda de partido, bloco ou bancada perde, após o encerramento do ano legislativo, o cargo na comissão; a vaga é preenchida por nomeação do Presidente da Câmara.",e:[["Quem muda de partido, bloco ou bancada perde imediatamente o cargo na comissão.","A perda ocorre após o encerramento do ano legislativo."],["A vaga deixada por quem mudou de partido é preenchida por eleição do Plenário.","É por nomeação do Presidente da Câmara, por indicação dos líderes."]]},
{a:"Art. 79, caput",t:"As Comissões Permanentes são compostas cada uma de 3 (três) membros e 2 (dois) suplentes.",c:"Cada Comissão Permanente é composta de 3 membros e 2 suplentes.",e:[["Cada Comissão Permanente é composta de 5 membros e 3 suplentes.","São 3 membros e 2 suplentes."],["Cada Comissão Permanente é composta de 3 membros e 3 suplentes.","São 2 suplentes."]]},
{a:"Art. 79, I a V",t:"I - Constituição, Justiça e Redação; II - Orçamento, Finanças e Contabilidade; III - Educação, Cultura e Esporte e Lazer; IV - Saúde, Seguridade e Bem-Estar Social; V - Desenvolvimento Social.",c:"Existe a Comissão Permanente de Educação, Cultura e Esporte e Lazer.",e:[["Existe a Comissão Permanente de Educação, Cultura, Esporte e Turismo.","É Educação, Cultura e Esporte e Lazer (o Turismo está com Desenvolvimento Econômico)."],["Existe a Comissão Permanente de Saúde e Assistência Social.","É Saúde, Seguridade e Bem-Estar Social."]]},
{a:"Art. 79, VI a VIII",t:"VI - Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos; VII - Desenvolvimento Econômico e Turismo; VIII - Agricultura e Cooperativismo.",c:"Existe a Comissão Permanente de Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos.",e:[["Existe a Comissão Permanente de Desenvolvimento Econômico e Cooperativismo.","É Desenvolvimento Econômico e Turismo (Cooperativismo está com Agricultura)."]]},
{a:"Art. 79, IX a XI",t:"IX - Defesa dos Direitos da Mulher, da Criança, do Adolescente e do Idoso; X - Defesa dos Direitos da Pessoa com Deficiência; XI - Meio Ambiente, Mudança de Clima e Proteção Animal.",c:"Existe a Comissão Permanente de Meio Ambiente, Mudança de Clima e Proteção Animal.",e:[["Existe a Comissão Permanente de Segurança Pública.","Não consta entre as Comissões Permanentes."],["Existem dez Comissões Permanentes.","São onze."]]}
],
"4A2 · Competência geral das Comissões Permanentes (Arts. 80, 82 e 83)":[
{a:"Art. 80, I",t:"Às Comissões Permanentes, em razão da matéria de sua competência, cabe: I - estudar proposições e outras matérias submetidas ao seu exame, apresentando, conforme o caso: a) parecer; b) substitutivos ou emendas; c) relatório conclusivo sobre as averiguações e inquéritos.",c:"As Comissões Permanentes estudam as proposições e apresentam, conforme o caso, parecer, substitutivos ou emendas e relatório conclusivo sobre averiguações e inquéritos.",e:[["As Comissões Permanentes decidem terminativamente as proposições de sua matéria, salvo recurso ao Plenário.","Em regra apresentam parecer; só decidem em caráter terminativo nos casos previstos (ex.: utilidade pública, Art. 81, I, c)."]]},
{a:"Art. 80, II e III",t:"II - promover estudos, pesquisas e investigações sobre assuntos de interesse público; III - tomar a iniciativa de elaboração de proposições ligadas ao estudo de tais assuntos, ou decorrentes de indicação da Câmara ou de dispositivos regimentais.",c:"As Comissões podem tomar a iniciativa de elaboração de proposições ligadas aos assuntos que estudam.",e:[["As Comissões só podem elaborar proposições a pedido do Presidente da Câmara.","Têm iniciativa própria, ou decorrente de indicação da Câmara ou de dispositivos regimentais."]]},
{a:"Art. 80, IV",t:"IV - redigir o vencido em primeira discussão ou em discussão única e oferecer redação final aos projetos de acordo com o seu mérito, bem como, quando for o caso, propor a reabertura da discussão nos termos regimentais.",c:"Cabe às Comissões redigir o vencido em primeira discussão ou em discussão única e oferecer redação final aos projetos, conforme o mérito.",e:[["Cabe às Comissões redigir o vencido apenas em segunda discussão.","É o vencido em primeira discussão ou em discussão única."]]},
{a:"Art. 80, V e VI",t:"V - realizar audiências públicas com entidades da sociedade civil; VI - convidar os Secretários Municipais ou equivalentes e os responsáveis pela administração direta ou indireta para prestarem informações sobre assuntos inerentes às suas atribuições.",c:"Cabe às Comissões convidar os Secretários Municipais ou equivalentes para prestarem informações sobre assuntos inerentes às suas atribuições.",e:[["Cabe às Comissões convocar os Secretários Municipais, sob pena de crime de responsabilidade.","O Art. 80, VI usa o verbo convidar (a convocação é prevista na Lei Orgânica, Art. 47, §1º, III)."]]},
{a:"Art. 80, VII e VIII",t:"VII - receber petições, reclamações, representações ou queixas de associações e entidades comunitárias ou de qualquer pessoa contra atos e omissões de autoridades municipais ou entidades públicas; VIII - solicitar ao Prefeito informações sobre assuntos referentes à Administração que sejam necessárias às atividades da Comissão e que guardem relação temática com a competência da Comissão.",c:"As Comissões podem solicitar ao Prefeito informações necessárias às suas atividades e que guardem relação temática com sua competência.",e:[["As Comissões podem solicitar ao Prefeito informações sobre qualquer assunto da Administração, independentemente de relação com sua competência.","As informações devem guardar relação temática com a competência da Comissão."],["As Comissões só recebem petições e queixas de entidades comunitárias, não de pessoas individuais.","Recebem também de qualquer pessoa."]]},
{a:"Art. 80, IX",t:"IX - fiscalizar, inclusive efetuando diligências, vistorias e levantamentos in loco, os atos da administração direta e indireta nos termos da legislação pertinente, em especial para verificar a regularidade, a eficiência e a eficácia dos seus órgãos no cumprimento dos objetivos institucionais.",c:"As Comissões fiscalizam os atos da administração direta e indireta, inclusive por diligências, vistorias e levantamentos in loco.",e:[["As Comissões fiscalizam apenas os atos da administração direta, e só mediante autorização do Plenário.","Fiscalizam a administração direta e indireta, inclusive efetuando diligências e vistorias in loco."]]},
{a:"Art. 80, X e XI",t:"X - acompanhar, junto ao Executivo, os atos de regulamentação, velando por sua completa adequação; XI - acompanhar, junto ao Executivo, a elaboração da proposta orçamentária, bem como a sua posterior execução.",c:"As Comissões acompanham, junto ao Executivo, a elaboração da proposta orçamentária e a sua posterior execução.",e:[["As Comissões acompanham, junto ao Executivo, apenas a execução do orçamento, e não a elaboração da proposta.","Acompanham a elaboração e a posterior execução."]]},
{a:"Art. 80, XII a XIV",t:"XII - solicitar informações ou depoimentos de autoridades ou cidadãos, quando guardarem relação temática com a competência da Comissão; XIII - apreciar programas de obras, planos regionais e setoriais de desenvolvimento e sobre eles emitir parecer; XIV - requisitar aos responsáveis a exibição de documentos e a prestação dos esclarecimentos necessários.",c:"As Comissões apreciam programas de obras, planos regionais e setoriais de desenvolvimento e sobre eles emitem parecer.",e:[["As Comissões aprovam, em caráter terminativo, os programas de obras e planos regionais de desenvolvimento.","Apreciam e emitem parecer."],["As Comissões solicitam depoimentos de autoridades ou cidadãos, mesmo sem relação temática com sua competência.","Só quando guardarem relação temática com a competência da Comissão."]]},
{a:"Art. 80, §1º",t:"Os projetos e demais proposições distribuídas às Comissões serão examinados pelo relator designado ou, quando for o caso, por subcomissão que emitirá parecer sobre o mérito.",c:"As proposições são examinadas pelo relator designado ou, quando for o caso, por subcomissão que emitirá parecer sobre o mérito.",e:[["As proposições são examinadas por subcomissão, que emite parecer sobre a constitucionalidade.","A subcomissão emite parecer sobre o mérito."]]},
{a:"Art. 80, §2º",t:"A Comissão de Constituição, Justiça e Redação manifestar-se-á sobre a constitucionalidade e legalidade, e a Comissão de Orçamento, Finanças e Contabilidade, sobre os aspectos financeiros e orçamentários de qualquer proposição.",c:"A Comissão de Orçamento, Finanças e Contabilidade manifesta-se sobre os aspectos financeiros e orçamentários de qualquer proposição.",e:[["A Comissão de Orçamento, Finanças e Contabilidade manifesta-se sobre a constitucionalidade e legalidade das proposições que criem despesa.","Seu foco é financeiro e orçamentário; constitucionalidade e legalidade são da CCJR."]]},
{a:"Art. 82",t:"É vedado às Comissões Permanentes, ao apreciarem proposição ou qualquer matéria submetida ao seu exame, opinar sobre aspectos que não sejam de sua atribuição específica.",c:"É vedado às Comissões Permanentes opinar sobre aspectos que não sejam de sua atribuição específica.",e:[["As Comissões Permanentes podem opinar sobre aspectos de outras Comissões, desde que conexos com a matéria.","É vedado opinar sobre aspectos que não sejam de sua atribuição específica."]]},
{a:"Art. 83",t:"É obrigatório o parecer das Comissões Permanentes nos assuntos de sua competência, ainda que proferido oralmente, nos termos deste Regimento Interno.",c:"É obrigatório o parecer das Comissões Permanentes nos assuntos de sua competência, ainda que proferido oralmente.",e:[["O parecer das Comissões Permanentes é facultativo quando a matéria for de iniciativa do Prefeito.","É obrigatório, ainda que oral."]]}
],
"4A3 · Competência específica: CCJR e Orçamento (Art. 81, I e II)":[
{a:"Art. 81, I, a",t:"Da Comissão de Constituição, Justiça e Redação: a) manifestar-se quanto ao aspecto constitucional, legal e regimental e quanto ao aspecto gramatical e lógico das proposições que tramitarem pela Câmara, excetuando-se as leis orçamentárias, os pareceres do Tribunal de Contas, os requerimentos e indicações.",c:"A CCJR manifesta-se sobre o aspecto constitucional, legal, regimental, gramatical e lógico das proposições, exceto leis orçamentárias, pareceres do TC, requerimentos e indicações.",e:[["A CCJR manifesta-se sobre todas as proposições, inclusive requerimentos e indicações.","Estão excetuados: leis orçamentárias, pareceres do TC, requerimentos e indicações."],["A CCJR manifesta-se também sobre o mérito das proposições.","O mérito é das demais comissões."]]},
{a:"Art. 81, I, b",t:"b) manifestar-se quanto aos pedidos de tramitação de urgência especial, devendo o requerimento ser submetido ao Plenário em casos de manifestação contrária da Comissão.",c:"A CCJR manifesta-se sobre os pedidos de urgência especial, e o requerimento é submetido ao Plenário se a manifestação for contrária.",e:[["O requerimento de urgência especial é sempre submetido ao Plenário, qualquer que seja a manifestação da CCJR.","Só vai ao Plenário nos casos de manifestação contrária da Comissão."]]},
{a:"Art. 81, I, c e d",t:"c) apreciar, votar, aprovar ou reprovar em caráter terminativo os projetos de lei que dispuserem sobre o reconhecimento de instituição como de utilidade pública; d) desincumbir-se de outras atribuições que lhe confere este Regimento.",c:"A CCJR aprova ou reprova, em caráter terminativo, os projetos de lei de reconhecimento de utilidade pública.",e:[["Os projetos de lei de reconhecimento de utilidade pública são votados pelo Plenário, com parecer da CCJR.","A CCJR decide em caráter terminativo."],["A CCJR decide em caráter terminativo os projetos de denominação de logradouros públicos.","O caráter terminativo é para utilidade pública."]]},
{a:"Art. 81, II, a e b",t:"Da Comissão de Orçamento, Finanças e Contabilidade: a) examinar e emitir parecer sobre projetos de lei relativos ao plano plurianual, às diretrizes orçamentárias, ao orçamento e aos créditos adicionais; b) examinar e emitir parecer sobre os planos e programas municipais e setoriais previstos na Lei Orgânica, e exercer o acompanhamento e a fiscalização orçamentária.",c:"A Comissão de Orçamento examina e emite parecer sobre os projetos de PPA, diretrizes orçamentárias, orçamento e créditos adicionais.",e:[["A Comissão de Orçamento examina apenas o orçamento anual; PPA e diretrizes são da CCJR.","Examina PPA, LDO, orçamento e créditos adicionais."]]},
{a:"Art. 81, II, c e d",t:"c) receber as emendas às leis orçamentárias do Município; d) elaboração da redação final do Projeto de Lei Orçamentária, do Projeto do Plano Plurianual e do Projeto de Lei de Diretrizes Orçamentárias, podendo, para tanto, solicitar ao Poder Executivo informações, documentos, arquivos, softwares e tabelas necessários.",c:"A Comissão de Orçamento elabora a redação final da LOA, do PPA e da LDO, podendo solicitar ao Executivo informações, documentos, arquivos, softwares e tabelas.",e:[["A redação final da LOA, do PPA e da LDO é elaborada pela CCJR.","Para as leis orçamentárias, é a Comissão de Orçamento, Finanças e Contabilidade."],["A Comissão de Orçamento recebe as emendas às leis orçamentárias por meio da Mesa Diretora.","Ela mesma recebe as emendas às leis orçamentárias."]]},
{a:"Art. 81, II, e e f",t:"e) opinar sobre proposições referentes à matéria tributária, abertura de créditos, empréstimos públicos, dívida pública e outras que, direta ou indiretamente, alterem a despesa ou a receita do Município e acarretem responsabilidades para o erário; f) examinar e emitir parecer sobre projetos de lei relativos à administração pública.",c:"A Comissão de Orçamento opina sobre matéria tributária, abertura de créditos, empréstimos públicos e dívida pública.",e:[["A matéria tributária e a dívida pública são examinadas pela CCJR.","São da Comissão de Orçamento, Finanças e Contabilidade."]]},
{a:"Art. 81, II, g e h",t:"g) examinar e emitir parecer sobre projetos de lei relativos à criação, estruturação, fusão e incorporação de secretarias e órgãos públicos municipais; h) examinar e emitir parecer sobre obtenção de empréstimo de particulares.",c:"A Comissão de Orçamento examina os projetos de criação, estruturação, fusão e incorporação de secretarias e órgãos públicos municipais.",e:[["A criação e a fusão de secretarias municipais são examinadas pela Comissão de Planejamento, Uso e Ocupação do Solo.","Compete à Comissão de Orçamento, Finanças e Contabilidade."]]},
{a:"Art. 81, II, i",t:"i) examinar e emitir parecer sobre os pareceres prévios do Tribunal de Contas do Estado relativos à prestação de contas do Prefeito e da Mesa da Câmara.",c:"A Comissão de Orçamento emite parecer sobre os pareceres prévios do TCE relativos às contas do Prefeito e da Mesa.",e:[["Os pareceres prévios do TCE sobre as contas do Prefeito e da Mesa são examinados pela CCJR.","É a Comissão de Orçamento, Finanças e Contabilidade."]]},
{a:"Art. 81, II, j e k",t:"j) examinar e emitir parecer sobre proposições que fixem os vencimentos do funcionalismo, a remuneração do Prefeito, Vice-Prefeito e Vereadores, verbas institucionais da Câmara Municipal, de gabinete e de manutenção; k) examinar e emitir parecer sobre todas as proposituras que, direta ou indiretamente, representem a mutação patrimonial do Município.",c:"A Comissão de Orçamento opina sobre proposições que fixem vencimentos do funcionalismo e a remuneração do Prefeito, do Vice e dos Vereadores.",e:[["A fixação da remuneração de Prefeito, Vice e Vereadores é examinada pela CCJR.","É da Comissão de Orçamento, Finanças e Contabilidade."]]}
],
"4A4 · Competência específica: demais Comissões (Art. 81, III a XI)":[
{a:"Art. 81, III, a",t:"Da Comissão de Educação, Cultura e Esporte e Lazer: a) examinar e emitir parecer sobre os projetos referentes à educação, ensino e artes, em especial sobre: 1. o Sistema Municipal de Ensino; 2. concessão de bolsas de estudos com finalidade de assistência à pesquisa tecnológica e científica para aperfeiçoamento do ensino; 3. programas de merenda escolar.",c:"A Comissão de Educação, Cultura e Esporte e Lazer examina o Sistema Municipal de Ensino, as bolsas de estudos e os programas de merenda escolar.",e:[["Os programas de merenda escolar são examinados pela Comissão de Saúde, Seguridade e Bem-Estar Social.","Merenda escolar é da Comissão de Educação, Cultura e Esporte e Lazer."]]},
{a:"Art. 81, III, b",t:"b) examinar e emitir parecer sobre os projetos referentes ao patrimônio histórico, artístico e cultural, em especial sobre: 1. preservação da memória da cidade; 2. denominação ou alterações de próprios, vias e logradouros públicos; 3. concessão de títulos honoríficos, outorga de honrarias, prêmios ou homenagens.",c:"A Comissão de Educação, Cultura e Esporte e Lazer examina a denominação de próprios, vias e logradouros públicos e a concessão de títulos honoríficos.",e:[["A denominação de vias e logradouros públicos é examinada pela Comissão de Planejamento, Uso e Ocupação do Solo.","É da Comissão de Educação, Cultura e Esporte e Lazer."],["A concessão de títulos honoríficos é examinada pela CCJR.","É da Comissão de Educação, Cultura e Esporte e Lazer."]]},
{a:"Art. 81, III, c e d",t:"c) examinar e emitir parecer sobre os projetos referentes aos esportes e às atividades de lazer; d) examinar e emitir parecer sobre os projetos referentes aos serviços, equipamentos e programas culturais, educacionais, esportivos, recreativos e de lazer voltados à comunidade, de forma geral.",c:"A Comissão de Educação, Cultura e Esporte e Lazer examina os projetos referentes aos esportes e às atividades de lazer.",e:[["Os projetos referentes a esportes e lazer são examinados pela Comissão de Desenvolvimento Social.","Esporte e lazer estão com a Comissão de Educação, Cultura e Esporte e Lazer."]]},
{a:"Art. 81, IV",t:"Da Comissão de Saúde, Seguridade e Bem-Estar Social: a) examinar e emitir parecer sobre todos os projetos referentes à saúde pública, à higiene e ao bem-estar social, sobre: 1. Sistema Único de Saúde e seguridade social; 2. vigilância sanitária, epidemiológica e nutricional; 3. demais aspectos específicos da saúde pública, higiene e da assistência sanitária municipal. b) examinar e emitir parecer sobre todos os projetos referentes à seguridade social, em especial sobre seguridade social, previdência, saúde e bem-estar do trabalhador.",c:"A Comissão de Saúde, Seguridade e Bem-Estar Social examina o SUS, a seguridade social, a vigilância sanitária, epidemiológica e nutricional e a previdência.",e:[["A previdência e o bem-estar do trabalhador são examinados pela Comissão de Desenvolvimento Social.","São da Comissão de Saúde, Seguridade e Bem-Estar Social."],["A vigilância sanitária é examinada pela Comissão de Meio Ambiente, Mudança de Clima e Proteção Animal.","Vigilância sanitária, epidemiológica e nutricional são da Comissão de Saúde."]]},
{a:"Art. 81, V",t:"Da Comissão de Desenvolvimento Social: a) examinar e emitir parecer sobre todas as proposições referentes ao desenvolvimento social e políticas de assistência social, especialmente sobre: 1. geração de emprego e renda; 2. projetos de reconhecimento do cidadão, buscando formas de integrá-lo ao meio social em que convive; 3. ações sociais e políticas assistenciais desenvolvidas pelo Município.",c:"A Comissão de Desenvolvimento Social examina a geração de emprego e renda e as ações sociais e políticas assistenciais do Município.",e:[["A geração de emprego e renda é examinada pela Comissão de Desenvolvimento Econômico e Turismo.","A geração de emprego e renda está na Comissão de Desenvolvimento Social."]]},
{a:"Art. 81, VI, a, 1 a 4",t:"Da Comissão de Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos: a) sem interferir na competência das demais: 1. processos atinentes à realização de obras e serviços, seu uso e gozo, doação de terra, venda, hipoteca, permuta, outorga de concessão administrativa ou direito real e uso de bens imóveis do Município; 2. serviços de utilidade pública, concedidos ou não, planos habitacionais; 3. transportes coletivos e individuais, frete e carga, utilização das vias urbanas e estradas municipais e sua sinalização, bem como meios de comunicação; 4. serviços públicos realizados pelo Município, diretamente ou por intermédio de autarquias ou órgãos paraestatais.",c:"A Comissão de Planejamento examina os transportes coletivos e individuais, o frete e a carga, a utilização das vias urbanas e a sua sinalização.",e:[["Os transportes coletivos e individuais são examinados pela Comissão de Desenvolvimento Econômico e Turismo.","São da Comissão de Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos."]]},
{a:"Art. 81, VI, a, 5 a 8",t:"5. examinar, a título informativo, os serviços públicos de concessão estadual ou federal que interessem ao Município; 6. cadastro territorial do Município, planos gerais e parciais de urbanização ou reurbanização, zoneamento, uso e ocupação do solo; 7. criação, organização, ou supressão de distritos e subdistritos, divisão do território em áreas administrativas; 8. plano diretor.",c:"A Comissão de Planejamento examina, a título informativo, os serviços públicos de concessão estadual ou federal que interessem ao Município.",e:[["A Comissão de Planejamento examina, em caráter deliberativo, os serviços públicos de concessão estadual ou federal.","É a título informativo."],["A criação e a supressão de distritos e subdistritos são examinadas pela CCJR.","São da Comissão de Planejamento, com o plano diretor e o zoneamento."]]},
{a:"Art. 81, VII",t:"Da Comissão de Desenvolvimento Econômico e Turismo: a) examinar e emitir parecer sobre todas as proposições relativas ao disciplinamento das atividades econômicas desenvolvidas no Município; b) relativas ao fomento, por todos os meios, à instalação de indústrias e de empresas comerciais e de prestação de serviços, auxiliando o Poder Executivo; c) relativas a programas de turismo, em suas mais diversas formas.",c:"A Comissão de Desenvolvimento Econômico e Turismo examina as proposições relativas a programas de turismo.",e:[["As proposições relativas a programas de turismo são examinadas pela Comissão de Educação, Cultura e Esporte e Lazer.","Turismo está com a Comissão de Desenvolvimento Econômico e Turismo."]]},
{a:"Art. 81, VIII",t:"Da Comissão de Agricultura e Cooperativismo: a) política agrícola e assuntos atinentes à agricultura e ao cooperativismo, destacadamente: 1. organização do setor rural; 2. política municipal de cooperativismo; 3. estímulos financeiros à agricultura e ao cooperativismo; 4. política municipal de crédito rural; 5. política agrícola e de desenvolvimento tecnológico da agropecuária; 6. política de abastecimento, comercialização e exportação de produtos agropecuários; 7. política de eletrificação rural; 8. vigilância e defesa sanitária animal e vegetal.",c:"A Comissão de Agricultura e Cooperativismo examina a política de crédito rural, a eletrificação rural e a vigilância e defesa sanitária animal e vegetal.",e:[["A eletrificação rural é examinada pela Comissão de Planejamento, Obras e Serviços Públicos.","A política de eletrificação rural é da Comissão de Agricultura e Cooperativismo."],["A vigilância e defesa sanitária animal e vegetal é examinada pela Comissão de Meio Ambiente, Mudança de Clima e Proteção Animal.","Está com a Comissão de Agricultura e Cooperativismo (item 8)."]]},
{a:"Art. 81, IX, a e b",t:"Da Comissão de Defesa dos Direitos da Mulher, da Criança, do Adolescente e da Pessoa Idosa: a) examinar e emitir parecer acerca de proposições relativas à defesa dos direitos humanos das minorias, das mulheres, das crianças, adolescentes e da pessoa idosa; b) instituir e supervisionar as Políticas Públicas de cada segmento no Município, tendo como marco inicial a criação dos respectivos conselhos municipais.",c:"A Comissão de Defesa dos Direitos da Mulher, da Criança, do Adolescente e da Pessoa Idosa supervisiona as políticas públicas de cada segmento, tendo como marco inicial a criação dos respectivos conselhos municipais.",e:[["Essa Comissão supervisiona as políticas públicas de cada segmento, tendo como marco inicial a aprovação do Plano Municipal de cada área.","O marco inicial é a criação dos respectivos conselhos municipais."]]},
{a:"Art. 81, IX, c",t:"c) acompanhar e buscar prevenção para os indicadores sociais das diferentes manifestações intrafamiliares da Violência Doméstica Física, Violência Doméstica Psicológica, Violência Doméstica Sexual, Violência Doméstica Fatal e a Negligência.",c:"A Comissão acompanha os indicadores da Violência Doméstica Física, Psicológica, Sexual e Fatal e da Negligência.",e:[["A Comissão acompanha os indicadores da Violência Doméstica Física, Psicológica, Sexual, Patrimonial e Fatal.","Constam Física, Psicológica, Sexual, Fatal e a Negligência (não a patrimonial)."]]},
{a:"Art. 81, IX, d a f",t:"d) fiscalizar e acompanhar os Programas Governamentais no cumprimento das Políticas Públicas exigidas nas legislações específicas; e) fiscalizar programas não governamentais relativos aos interesses dos segmentos representados na Comissão; f) promover campanhas de esclarecimento, encontros e seminários sobre as políticas públicas em parceria com instituições públicas e privadas legalmente constituídas.",c:"A Comissão fiscaliza programas não governamentais relativos aos interesses dos segmentos que representa.",e:[["A Comissão fiscaliza apenas os programas governamentais; os não governamentais não estão sujeitos à sua fiscalização.","Fiscaliza também os programas não governamentais."]]},
{a:"Art. 81, IX, g a i",t:"g) receber, avaliar e proceder a investigações relativas às ameaças ou violação aos direitos dos segmentos da Comissão; h) convidar Ministério Público, Defensoria Pública, Poder Judiciário, Segurança Pública e demais autoridades do Executivo e sociedade civil para compor um grupo de acompanhamento ao trabalho investigativo; i) colaborar com entidades não governamentais, nacionais e internacionais.",c:"A Comissão convida o Ministério Público, a Defensoria, o Judiciário e a Segurança Pública para compor um grupo de acompanhamento ao trabalho investigativo.",e:[["A Comissão convoca o Ministério Público e o Judiciário para compor o grupo de acompanhamento do trabalho investigativo.","O verbo é convidar."]]},
{a:"Art. 81, X",t:"Da Comissão de Defesa dos Direitos da Pessoa Com Deficiência: a) analisar projetos de lei e proposições relacionadas aos direitos das pessoas com deficiência; b) receber e avaliar denúncias relativas à ameaça ou violação dos direitos; c) colaborar com entidades não governamentais que atuem na defesa dos direitos; d) promover debates e audiências públicas sobre temas relevantes, convidando especialistas, representantes de organizações da sociedade civil, órgãos públicos e as próprias pessoas com deficiência; e) atuar na fiscalização da aplicação de leis e políticas públicas, monitorando a eficácia dessas ações; f) atuar como canal de apoio para organizações que atuam na defesa dos direitos, além de fornecer informações à sociedade em geral sobre os direitos dessa população.",c:"A Comissão de Defesa dos Direitos da Pessoa com Deficiência promove debates e audiências públicas, convidando especialistas, organizações, órgãos públicos e as próprias pessoas com deficiência.",e:[["A Comissão da Pessoa com Deficiência não pode receber denúncias; deve encaminhá-las ao Ministério Público.","Recebe e avalia denúncias de ameaça ou violação de direitos."]]},
{a:"Art. 81, XI, a a d",t:"Da Comissão de Meio Ambiente, Mudança do Clima e Proteção Animal: a) analisar projetos de lei e proposições relacionadas à política e sistema municipal do meio ambiente, direito ambiental municipal, legislação de defesa ecológica; b) ao controle de poluição ambiental em todos os aspectos e preservação dos recursos renováveis; c) à flora, fauna, solo, edafologia e desertificação; d) ao desenvolvimento sustentável.",c:"A Comissão de Meio Ambiente analisa as proposições sobre controle de poluição ambiental, flora, fauna, solo, edafologia e desertificação.",e:[["A desertificação e o solo são analisados pela Comissão de Agricultura e Cooperativismo.","Flora, fauna, solo, edafologia e desertificação são da Comissão de Meio Ambiente."]]},
{a:"Art. 81, XI, e",t:"e) analisar projetos de lei, bem como acompanhar políticas municipais e buscar iniciativas com entidades não governamentais relacionadas à proteção animal.",c:"A Comissão de Meio Ambiente, Mudança do Clima e Proteção Animal acompanha políticas municipais e busca iniciativas com entidades não governamentais relacionadas à proteção animal.",e:[["A proteção animal é competência da Comissão de Agricultura e Cooperativismo.","A política de proteção animal é da Comissão de Meio Ambiente (a Agricultura trata da defesa sanitária animal, item VIII, 8)."]]}
]
};

const $=i=>document.getElementById(i);
const expand=d=>d.flatMap(p=>[...(p.c?[{q:p.c,ok:1,a:p.a,t:p.t}]:[]),...(p.e||[]).map(([q,w])=>({q,ok:0,a:p.a,t:p.t,w}))]);
let list=[],i=0,back=false;
function build(){
 const v=$("dk").value,ks=v=="*"?Object.keys(D):[v];
 list=ks.flatMap(k=>{let c=expand(D[k]);if($("sh").checked)c=c.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);return c});
 i=0;back=false;draw();
}
function draw(){
 const c=list[i],el=$("card");el.innerHTML="";el.className="";
 if(!c){el.textContent="Nenhum card.";return}
 const d=(t,cl)=>{const e=document.createElement("div");if(cl)e.className=cl;e.textContent=t;el.appendChild(e);return e};
 if(!back){d(c.q);d("Toque para virar","hint")}
 else{el.className=c.ok?"ok":"no";d(c.ok?"✔ CERTO":"✘ ERRADO","tag");d(c.a,"art");d(c.t,"lit");if(c.w){const w=d("Motivo: "+c.w);w.style.marginTop="12px"}}
 $("pg").textContent=(i+1)+" / "+list.length;
}
function go(n){if(!list.length)return;i=(i+n+list.length)%list.length;back=false;draw()}
$("card").onclick=()=>{back=!back;draw()};
$("nx").onclick=()=>go(1);$("pv").onclick=()=>go(-1);$("sh").onchange=build;$("dk").onchange=build;
document.onkeydown=e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "){e.preventDefault();back=!back;draw()}};
$("ex").onclick=()=>{
 const q=s=>'"'+s.replace(/"/g,'""')+'"';
 const rows=Object.keys(D).flatMap(k=>expand(D[k]).map(c=>q(c.q)+";"+q((c.ok?"CERTO":"ERRADO")+" | "+c.a+" | "+c.t+(c.w?" | Motivo: "+c.w:""))));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/plain;charset=utf-8"}));a.download="regimento_flashcards.txt";a.click();
};
$("dk").innerHTML='<option value="*">Todos os blocos (em ordem)</option>'+Object.keys(D).map(k=>'<option>'+k+'</option>').join("");
build();
</script></body></html>
