const D={
"1 · Posse e Mesa (Arts. 1-21)":[
{a:"Art. 1º",t:"A Câmara Municipal é o órgão legislativo e fiscalizador do Município e tem sua sede nesta cidade de Mossoró, Rio Grande do Norte.",c:"A Câmara Municipal é o órgão legislativo e fiscalizador do Município, com sede em Mossoró.",e:[["A Câmara Municipal é o órgão legislativo e executivo do Município, com sede em Mossoró.","É legislativo e fiscalizador; o Executivo é exercido pelo Prefeito."]]},
{a:"Art. 2º, caput",t:"Vereadores eleitos pelo sistema proporcional, como representantes do povo, tendo mandato de quatro anos.",c:"Os Vereadores são eleitos pelo sistema proporcional, com mandato de quatro anos.",e:[["Os Vereadores são eleitos pelo sistema majoritário, com mandato de quatro anos.","O sistema é o proporcional."]]},
{a:"Art. 2º, §1º",t:"Condições de elegibilidade: nacionalidade brasileira; pleno exercício dos direitos políticos; alistamento eleitoral; domicílio eleitoral; filiação partidária; idade mínima de dezoito anos; ser alfabetizado.",c:"Para ser Vereador exige-se idade mínima de dezoito anos e ser alfabetizado.",e:[["Para ser Vereador exige-se idade mínima de vinte e um anos.","A idade mínima é 18 anos (os 21 são do Prefeito, na Lei Orgânica)."]]},
{a:"Art. 2º, §2º",t:"O número de Vereadores será fixado pela Justiça Eleitoral, tendo em vista o disposto no artigo 29, inciso IV, da Constituição Federal.",c:"O número de Vereadores é fixado pela Justiça Eleitoral.",e:[["O número de Vereadores é fixado pela Mesa Diretora.","Quem fixa é a Justiça Eleitoral."]]},
{a:"Art. 3º, caput",t:"A Câmara tem funções legislativas, exerce atribuições de fiscalização externa, financeira e orçamentária, de controle e de assessoramento dos atos do Poder Executivo, bem como exerce atos de administração interna.",c:"A Câmara exerce funções legislativa, fiscalizadora, de controle, de assessoramento e de administração interna.",e:[["A Câmara exerce apenas funções legislativa e fiscalizadora.","Também há controle, assessoramento e administração interna."]]},
{a:"Art. 3º, §2º",t:"A função de fiscalização (contábil, financeira, orçamentária e patrimonial) é exercida com o auxílio do Tribunal de Contas do Estado.",c:"A fiscalização da Câmara é exercida com o auxílio do Tribunal de Contas do Estado.",e:[["A fiscalização da Câmara é exercida com o auxílio do Ministério Público.","O auxílio é do Tribunal de Contas do Estado."]]},
{a:"Art. 3º, §3º",t:"A função de controle é de caráter político-administrativo e se exerce sobre o Prefeito, Vice-Prefeito, Secretários Municipais, Mesa do Legislativo e Vereadores, mas não se exerce sobre os agentes administrativos sujeitos à ação hierárquica.",c:"A função de controle não se exerce sobre os agentes administrativos sujeitos à ação hierárquica.",e:[["A função de controle se exerce também sobre os agentes administrativos sujeitos à ação hierárquica.","Esses agentes ficam de fora do controle."]]},
{a:"Art. 3º, §4º",t:"A função de assessoramento consiste em sugerir medidas de interesse público ao Executivo, mediante indicações.",c:"O assessoramento consiste em sugerir medidas ao Executivo mediante indicações.",e:[["O assessoramento consiste em sugerir medidas ao Executivo mediante requerimentos.","O instrumento é a indicação."]]},
{a:"Art. 4º",t:"A Câmara instalar-se-á em sessão solene de posse no dia 1º de janeiro de cada legislatura, independentemente de número, sob a presidência do Vereador mais idoso entre os presentes ou, caso essa condição seja comum a dois ou mais Vereadores, do mais votado dentre eles na eleição municipal.",c:"Na sessão solene de posse, preside o Vereador mais idoso entre os presentes; se a condição for comum a mais de um, o mais votado dentre eles.",e:[["Na sessão solene de posse, preside o Vereador mais idoso entre os presentes, sem critério de desempate.","Há desempate: o mais votado na eleição municipal."],["Na sessão solene de posse, preside o Vereador mais votado; havendo empate, o mais idoso.","Inversão: o critério principal é a idade; o desempate é o mais votado."],["A sessão solene de posse só se instala com a presença da maioria absoluta dos Vereadores.","Instala-se independentemente de número."]]},
{a:"Art. 4º",t:"... que convidará dois Vereadores, de preferência de partidos diferentes, que servirão para secretariar os trabalhos e dar posse ao Prefeito, Vice-Prefeito e Vereadores.",c:"O presidente da sessão de posse convida dois Vereadores, de preferência de partidos diferentes, para secretariar os trabalhos.",e:[["O presidente da sessão de posse convida três Vereadores, de preferência do mesmo partido, para secretariar os trabalhos.","São dois Vereadores, de preferência de partidos diferentes."]]},
{a:"Art. 5º",t:"O Prefeito, Vice-Prefeito, os Vereadores eleitos e Vereadoras eleitas deverão apresentar seus diplomas à Diretoria Legislativa da Câmara antes da sessão solene de posse.",c:"Os diplomas são apresentados à Diretoria Legislativa antes da sessão solene de posse.",e:[["Os diplomas são apresentados ao Presidente da Câmara durante a sessão solene de posse.","É à Diretoria Legislativa, antes da sessão."]]},
{a:"Art. 6º, I",t:"O Prefeito, os Vereadores e as Vereadoras deverão apresentar, no ato da posse, documento comprobatório da desincompatibilização sob pena de extinção do mandato.",c:"A falta de comprovação da desincompatibilização na posse gera extinção do mandato.",e:[["A falta de comprovação da desincompatibilização na posse gera cassação do mandato.","A sanção é a extinção (cassação é da declaração de bens)."]]},
{a:"Art. 6º, II",t:"Na mesma ocasião, o Prefeito, o Vice-Prefeito, os Vereadores e as Vereadoras deverão apresentar declaração pública de seus bens, a qual será devidamente arquivada, sob pena de cassação de mandato.",c:"A falta de declaração pública de bens na posse gera cassação do mandato.",e:[["A falta de declaração pública de bens na posse gera extinção do mandato.","Aqui a sanção é a cassação."]]},
{a:"Art. 6º, III",t:"O Vice-Prefeito apresentará documento comprobatório de desincompatibilização no momento em que assumir o exercício do cargo de Prefeito.",c:"O Vice-Prefeito comprova a desincompatibilização quando assume o exercício do cargo de Prefeito.",e:[["O Vice-Prefeito comprova a desincompatibilização no momento da sua própria posse.","É quando assumir o exercício de Prefeito."]]},
{a:"Art. 6º, V e VI",t:"Após a posse dos Vereadores, o Presidente dos trabalhos conduzirá a eleição da Mesa; após ela, o Prefeito e o Vice-Prefeito serão convidados a prestar o compromisso, sendo declarados empossados.",c:"Prefeito e Vice-Prefeito prestam o compromisso depois da eleição da Mesa Diretora.",e:[["Prefeito e Vice-Prefeito prestam o compromisso antes da eleição da Mesa Diretora.","A ordem é: posse dos Vereadores, eleição da Mesa, compromisso do Prefeito e Vice."]]},
{a:"Art. 6º, VII",t:"Poderão fazer uso da palavra, pelo prazo máximo de dez minutos, um representante de cada bancada ou bloco parlamentar, o Prefeito, o Vice-Prefeito e o Presidente da Câmara.",c:"Na sessão de posse, falam por até dez minutos um representante de cada bancada ou bloco, o Prefeito, o Vice e o Presidente.",e:[["Na sessão de posse, falam por até cinco minutos um representante de cada bancada ou bloco, o Prefeito, o Vice e o Presidente.","O prazo máximo é de dez minutos."]]},
{a:"Art. 6º, VIII",t:"O nome parlamentar será composto de dois elementos apenas: um prenome e um nome; dois nomes; ou dois prenomes. Havendo confusão entre dois nomes parlamentares, decidirá o Presidente.",c:"O nome parlamentar tem apenas dois elementos; havendo confusão entre nomes, decide o Presidente.",e:[["O nome parlamentar tem até três elementos; havendo confusão entre nomes, decide o Plenário.","São dois elementos apenas, e decide o Presidente."]]},
{a:"Art. 6º, p. único",t:"Poderá o Presidente colher o compromisso de posse por videoconferência, excepcionalmente nos casos de licença-gestante, com declaração de parto em período inferior a 120 dias.",c:"A posse por videoconferência é excepcional, para licença-gestante, com declaração de parto em período inferior a 120 dias.",e:[["A posse por videoconferência é excepcional, para licença-gestante, com declaração de parto em período inferior a 180 dias.","O prazo é 120 dias."]]},
{a:"Art. 7º, I e II",t:"A posse deverá ocorrer dentro de 15 dias, tratando-se de Vereador(a), e de 10 dias da data fixada, tratando-se de Prefeito e Vice-Prefeito, salvo motivo justo aceito pela Câmara.",c:"Vereador tem 15 dias para tomar posse; Prefeito e Vice-Prefeito têm 10 dias.",e:[["Vereador tem 10 dias para tomar posse; Prefeito e Vice-Prefeito têm 15 dias.","Os prazos estão trocados: 15 para Vereador, 10 para Prefeito e Vice."]]},
{a:"Art. 7º, III",t:"Na hipótese de não realização de sessão ordinária ou extraordinária nos prazos indicados, a posse poderá ocorrer em sessão junto à Mesa, salvo em período de recesso, quando o compromisso deverá ser prestado perante o Presidente.",c:"Em período de recesso, o compromisso de posse é prestado perante o Presidente.",e:[["Em período de recesso, o compromisso de posse é prestado perante o Plenário.","No recesso, é perante o Presidente."]]},
{a:"Art. 8º",t:"O exercício do mandato dar-se-á automaticamente com a posse. A transmissão do cargo de Prefeito, quando houver, dar-se-á no Gabinete do Prefeito, após a posse.",c:"A transmissão do cargo de Prefeito, quando houver, ocorre no Gabinete do Prefeito, após a posse.",e:[["A transmissão do cargo de Prefeito, quando houver, ocorre no Plenário da Câmara, durante a sessão solene.","Ocorre no Gabinete do Prefeito, após a posse."]]},
{a:"Art. 9º",t:"A recusa do Vereador eleito a tomar posse importa em renúncia tácita ao mandato, devendo o Presidente, após o prazo do art. 7º, I, declarar extinto o mandato e convocar o suplente.",c:"A recusa do Vereador eleito a tomar posse é renúncia tácita; o Presidente declara extinto o mandato e convoca o suplente.",e:[["A recusa do Vereador eleito a tomar posse leva à cassação do mandato, declarada pelo Plenário.","É renúncia tácita, com extinção declarada pelo Presidente."]]},
{a:"Art. 10",t:"Enquanto não ocorrer a posse do Prefeito, assumirá o cargo o Vice-Prefeito e, na falta ou impedimento deste, o Presidente da Câmara.",c:"Até a posse do Prefeito, assume o Vice-Prefeito e, na falta deste, o Presidente da Câmara.",e:[["Até a posse do Prefeito, assume o Presidente da Câmara e, na falta deste, o Vice-Prefeito.","A ordem é Vice-Prefeito primeiro, depois o Presidente da Câmara."]]},
{a:"Art. 11, §2º",t:"Ocorrendo a recusa do Prefeito e do Vice-Prefeito, o Presidente da Câmara assumirá o cargo de Prefeito até a posse dos novos eleitos ou até a conclusão do mandato, conforme a Lei Orgânica.",c:"Recusando-se Prefeito e Vice a tomar posse, o Presidente da Câmara assume o cargo de Prefeito.",e:[["Recusando-se Prefeito e Vice a tomar posse, o Presidente da Câmara convoca eleição direta em 90 dias.","O Presidente da Câmara assume o cargo."]]},
{a:"Arts. 12 e 13",t:"A eleição da Mesa para o primeiro biênio far-se-á logo após a posse dos Vereadores, em 1º de janeiro do primeiro ano da legislatura. Na eleição, o Presidente em exercício tem direito a voto.",c:"Na eleição da Mesa, o Presidente em exercício tem direito a voto.",e:[["Na eleição da Mesa, o Presidente em exercício não vota, salvo para desempatar.","Ele tem direito a voto."]]},
{a:"Art. 14",t:"O mandato da Mesa Diretora será de 02 (dois) anos, sendo permitida a reeleição na mesma legislatura ou em legislaturas distintas.",c:"O mandato da Mesa é de dois anos, permitida a reeleição na mesma legislatura.",e:[["O mandato da Mesa é de dois anos, vedada a reeleição na mesma legislatura.","A reeleição é permitida, na mesma legislatura ou em distintas."]]},
{a:"Art. 15",t:"A Mesa da Câmara é composta pelo Presidente, 1º e 2º Secretários. Haverá dois Vice-Presidentes, Terceiro e Quarto Secretários, que somente serão considerados integrantes da Mesa quando em efetivo exercício.",c:"A Mesa é composta pelo Presidente e pelos 1º e 2º Secretários; os demais só integram a Mesa quando em efetivo exercício.",e:[["A Mesa é composta pelo Presidente, pelos dois Vice-Presidentes e pelos 1º e 2º Secretários.","Vice-Presidentes e 3º e 4º Secretários só contam quando em efetivo exercício."]]},
{a:"Art. 16",t:"A eleição da Mesa dar-se-á em votação eletrônica por maioria simples de votos. Na composição da Mesa é assegurada, na medida do possível, a participação proporcional dos partidos.",c:"A eleição da Mesa é por votação eletrônica e maioria simples.",e:[["A eleição da Mesa é por votação eletrônica e maioria absoluta.","O quórum é maioria simples."]]},
{a:"Art. 17, II",t:"Os requerimentos de registro de candidatura deverão ser entregues à Diretoria Legislativa, impreterivelmente, até uma hora antes do horário previsto para o início da sessão.",c:"Os requerimentos de registro de candidatura à Mesa vão à Diretoria Legislativa até uma hora antes da sessão.",e:[["Os requerimentos de registro de candidatura à Mesa vão à Diretoria Legislativa até 24 horas antes da sessão.","O prazo é até uma hora antes do início da sessão."]]},
{a:"Art. 17, VIII e IX",t:"Segundo escrutínio com os mais votados para o mesmo cargo que tenham igual número de votos; persistindo o empate, será eleito o Vereador mais idoso e, se tiverem a mesma idade, o mais votado na eleição municipal.",c:"Persistindo o empate no segundo escrutínio, é eleito o Vereador mais idoso; se a idade for igual, o mais votado na eleição municipal.",e:[["Persistindo o empate no segundo escrutínio, a eleição se decide por sorteio.","Decide o mais idoso e, depois, o mais votado na eleição."]]},
{a:"Art. 17, p. único",t:"No caso de impossibilidade técnica do sistema eletrônico, far-se-á a eleição por votação nominal em documento impresso.",c:"Com impossibilidade técnica do sistema eletrônico, a eleição da Mesa é por votação nominal em documento impresso.",e:[["Com impossibilidade técnica do sistema eletrônico, a eleição da Mesa é adiada para a sessão seguinte.","Faz-se por votação nominal em documento impresso."]]},
{a:"Art. 18",t:"Não se realizando a sessão ou a eleição por falta de número legal, quando do início da legislatura, o Vereador mais idoso permanece na presidência e convocará sessões diárias, até que seja eleita a nova Mesa.",c:"Sem número legal para eleger a Mesa, o Vereador mais idoso permanece na presidência e convoca sessões diárias.",e:[["Sem número legal para eleger a Mesa, o Vereador mais idoso permanece na presidência e convoca sessões semanais.","As sessões são diárias."]]},
{a:"Art. 19, caput",t:"A convocação para eleição da Mesa para o segundo biênio deverá ser realizada por convocação da Mesa Diretora ou por 2/3 (dois terços) dos Vereadores.",c:"A eleição da Mesa do segundo biênio é convocada pela Mesa Diretora ou por 2/3 dos Vereadores.",e:[["A eleição da Mesa do segundo biênio é convocada pela Mesa Diretora ou pela maioria absoluta dos Vereadores.","O quórum de convocação é 2/3."]]},
{a:"Art. 19, §§2º e 3º",t:"A posse da Mesa eleita para o segundo biênio ocorrerá no primeiro dia útil de janeiro do terceiro ano da legislatura. Se o Presidente foi reeleito, a data poderá ser alterada mediante proposição dele e aprovação de maioria do plenário.",c:"A posse da Mesa do segundo biênio ocorre no primeiro dia útil de janeiro do terceiro ano da legislatura.",e:[["A posse da Mesa do segundo biênio ocorre em 1º de fevereiro do terceiro ano da legislatura.","É no primeiro dia útil de janeiro."]]},
{a:"Arts. 20 e 21",t:"O Presidente da Mesa Diretora é o Presidente da Câmara Municipal. Os membros da Mesa Diretora não poderão fazer parte da liderança.",c:"Os membros da Mesa Diretora não podem fazer parte da liderança.",e:[["Os membros da Mesa Diretora podem exercer a liderança de bancada, mas não a de governo.","Nenhum membro da Mesa pode fazer parte da liderança."]]}
],
,
"2A · Mesa Diretora (Arts. 22-26)":[
{a:"Art. 22, caput",t:"A Mesa Diretora reunir-se-á ordinariamente uma vez por quinzena, em dia e hora previamente fixados e, extraordinariamente, sempre que convocada pelo Presidente ou pela maioria de seus membros.",c:"A Mesa Diretora reúne-se ordinariamente uma vez por quinzena.",e:[["A Mesa Diretora reúne-se ordinariamente uma vez por semana.","A periodicidade é quinzenal."],["A Mesa Diretora reúne-se ordinariamente uma vez por mês.","A periodicidade é quinzenal."]]},
{a:"Art. 22, caput",t:"… extraordinariamente, sempre que convocada pelo Presidente ou pela maioria de seus membros.",c:"A Mesa reúne-se extraordinariamente quando convocada pelo Presidente ou pela maioria de seus membros.",e:[["A Mesa reúne-se extraordinariamente quando convocada pelo Presidente ou por 1/3 dos Vereadores.","A convocação é do Presidente ou da maioria dos membros da Mesa."]]},
{a:"Art. 22, p. único",t:"Perderá o cargo o membro da Mesa Diretora que deixar de comparecer a cinco reuniões ordinárias consecutivas, sem causa justificada.",c:"Perde o cargo o membro da Mesa que faltar a cinco reuniões ordinárias consecutivas, sem causa justificada.",e:[["Perde o cargo o membro da Mesa que faltar a três reuniões ordinárias consecutivas, sem causa justificada.","São cinco (as três faltas são das Comissões Permanentes, Art. 113, §2º)."],["Perde o cargo o membro da Mesa que faltar a cinco reuniões ordinárias, consecutivas ou não, sem causa justificada.","As cinco faltas devem ser consecutivas."]]},
{a:"Art. 23",t:"A Mesa Diretora, na qualidade de órgão diretor do Poder Legislativo, incumbe-se da direção dos trabalhos legislativos e dos serviços administrativos da Câmara Municipal.",c:"A Mesa Diretora incumbe-se da direção dos trabalhos legislativos e dos serviços administrativos da Câmara.",e:[["A Mesa Diretora incumbe-se apenas da direção dos serviços administrativos da Câmara.","Dirige também os trabalhos legislativos."]]},
{a:"Art. 24, I, a e b",t:"Propor projetos de lei ordinária ou complementar, inclusive dispondo sobre: a) o subsídio do Prefeito, do Vice-Prefeito e Secretários municipais, de uma legislatura para a outra; b) o subsídio dos Vereadores, de uma legislatura para outra.",c:"Compete à Mesa propor projeto de lei sobre o subsídio dos Vereadores, de uma legislatura para outra.",e:[["Compete à Mesa propor projeto de decreto legislativo sobre o subsídio dos Vereadores.","O instrumento é o projeto de lei."],["Compete à Mesa propor projeto de lei sobre o subsídio do Prefeito, a vigorar na própria legislatura em curso.","A fixação vale de uma legislatura para a subsequente."]]},
{a:"Art. 24, I, c",t:"Propor projetos de lei dispondo sobre sua organização, funcionamento, polícia, criação, transformação ou extinção dos cargos, empregos ou funções de seus serviços e fixação da respectiva remuneração, observados os parâmetros da lei de diretrizes orçamentárias.",c:"A Mesa propõe projeto de lei sobre a criação de cargos dos serviços da Câmara e sua remuneração, observada a lei de diretrizes orçamentárias.",e:[["A Mesa propõe projeto de lei sobre a criação de cargos dos serviços da Câmara, de iniciativa concorrente com o Prefeito.","A iniciativa é da Mesa, sem concorrência."]]},
{a:"Art. 24, II",t:"Propor projetos de decreto legislativo dispondo sobre: a) concessão de licença do Prefeito para afastamento do cargo; b) autorização ao Prefeito para, por necessidade de serviço, ausentar-se do Município por mais de quinze dias.",c:"A Mesa propõe decreto legislativo autorizando o Prefeito a ausentar-se do Município por mais de quinze dias.",e:[["A Mesa propõe decreto legislativo autorizando o Prefeito a ausentar-se do Município por mais de trinta dias.","O prazo é mais de quinze dias."],["A Mesa propõe projeto de lei concedendo licença ao Prefeito para afastamento do cargo.","É projeto de decreto legislativo."]]},
{a:"Art. 24, III a V",t:"III - propor projetos de resolução dispondo sobre matérias de interesse interno da Câmara; IV - propor ação de inconstitucionalidade; V - promulgar emendas à Lei Orgânica Municipal.",c:"Compete à Mesa promulgar emendas à Lei Orgânica Municipal.",e:[["Compete ao Presidente da Câmara, isoladamente, promulgar emendas à Lei Orgânica Municipal.","A promulgação é da Mesa Diretora."]]},
{a:"Art. 24, IX",t:"Adotar as providências cabíveis, por solicitação do interessado, para a defesa judicial ou extrajudicial de Vereador contra ameaças ou a prática de ato atentatório ao livre exercício e às prerrogativas constitucionais do mandato.",c:"A Mesa adota providências para a defesa de Vereador por solicitação do interessado.",e:[["A Mesa adota providências para a defesa de Vereador de ofício, independentemente de solicitação.","Depende de solicitação do interessado."]]},
{a:"Art. 24, X",t:"Declarar a perda de mandato de Vereador, nos termos da Lei Orgânica Municipal, por ato da Mesa Diretora.",c:"Compete à Mesa Diretora declarar, por ato seu, a perda de mandato de Vereador, nos termos da Lei Orgânica."},
{a:"Art. 24, XI",t:"Autorizar licitações, homologar seus resultados e aprovar o calendário de compras.",c:"A Mesa autoriza licitações, homologa seus resultados e aprova o calendário de compras.",e:[["A Mesa Diretora procede às licitações para compras, obras e serviços da Câmara.","A Mesa autoriza e homologa; quem procede às licitações é o Presidente (Art. 27, VII, d)."]]},
{a:"Art. 24, XII",t:"Apresentar ao Plenário, na sessão de encerramento do ano legislativo, resenha dos trabalhos realizados, precedida de sucinto relatório sobre seu desempenho.",c:"A Mesa apresenta ao Plenário, na sessão de encerramento do ano legislativo, resenha dos trabalhos realizados.",e:[["A Mesa apresenta ao Plenário, na sessão de abertura do ano legislativo, resenha dos trabalhos realizados.","É na sessão de encerramento."]]},
{a:"Art. 24, XIV e XV",t:"Elaborar e encaminhar ao Poder Executivo, até 15 de julho, a proposta orçamentária da Câmara; se não for encaminhada no prazo, será tomado como base o orçamento vigente para a Câmara.",c:"A Mesa encaminha ao Executivo, até 15 de julho, a proposta orçamentária da Câmara.",e:[["A Mesa encaminha ao Executivo, até 15 de abril, a proposta orçamentária da Câmara.","O prazo é 15 de julho (15 de abril é da LDO do Prefeito)."],["Não encaminhada a proposta no prazo, a Câmara fica sem dotação até a aprovação do orçamento.","Toma-se como base o orçamento vigente para a Câmara."]]},
{a:"Art. 24, XVI e XVII",t:"XVI - suplementar, mediante ato, as dotações orçamentárias da Câmara, observado o limite da autorização constante de lei orçamentária, desde que os recursos provenham de anulação total ou parcial de suas dotações; XVII - devolver à Fazenda Municipal, até o dia 31 de dezembro, o saldo de numerário que lhe foi liberado durante o exercício.",c:"A Mesa devolve à Fazenda Municipal, até 31 de dezembro, o saldo de numerário liberado no exercício.",e:[["A Mesa devolve à Fazenda Municipal, até 20 de dezembro, o saldo de numerário liberado no exercício.","O prazo é 31 de dezembro."],["A Mesa suplementa, mediante ato, as dotações da Câmara com recursos de excesso de arrecadação.","Os recursos devem vir de anulação total ou parcial de dotações da própria Câmara."]]},
{a:"Art. 24, XVIII a XX",t:"XVIII - designar, mediante ato, Vereadores para missão de representação da Câmara, fixando o número de representantes conforme os limites do orçamento; XIX - abrir, mediante ato, sindicâncias e processos administrativos e aplicar penalidades; XX - atualizar, mediante ato, a remuneração dos Vereadores, nas épocas e segundo os critérios estabelecidos em lei.",c:"A Mesa abre, mediante ato, sindicâncias e processos administrativos e aplica penalidades.",e:[["A Mesa designa Vereadores para missão de representação, sem limite de número, independentemente do orçamento.","O número de representantes obedece aos limites do orçamento."]]},
{a:"Art. 24, XXII",t:"Criar, mediante ato, Comissões Especiais de Inquérito, nos termos que dispuser este Regimento Interno.",c:"A Mesa cria, mediante ato, Comissões Especiais de Inquérito, nos termos do Regimento.",e:[["A Mesa cria Comissões Especiais de Inquérito mediante decreto legislativo.","A criação é por ato da Mesa."]]},
{a:"Art. 24, §§1º e 2º",t:"§1º Os atos administrativos da Mesa serão numerados em ordem cronológica, com renovação a cada ano da legislatura. §2º A recusa injustificada de assinatura dos atos da Mesa ensejará o processo de destituição do membro faltoso.",c:"Os atos da Mesa são numerados em ordem cronológica, com renovação a cada ano da legislatura.",e:[["Os atos da Mesa são numerados em ordem cronológica, com renovação a cada legislatura.","A numeração renova-se a cada ano da legislatura."],["A recusa injustificada de assinatura dos atos da Mesa enseja advertência do membro faltoso.","Enseja processo de destituição."]]},
{a:"Art. 25",t:"As decisões da Mesa Diretora serão tomadas de forma colegiada, por maioria de seus membros.",c:"As decisões da Mesa Diretora são tomadas de forma colegiada, por maioria de seus membros.",e:[["As decisões da Mesa Diretora são tomadas pelo Presidente, ouvidos os demais membros.","São colegiadas, por maioria."]]},
{a:"Art. 26",t:"O Presidente da Mesa Diretora é o Presidente da Câmara Municipal, sendo o representante legal da instituição nas suas relações externas, competindo-lhe as funções administrativas e diretivas internas.",c:"O Presidente da Câmara é o representante legal da instituição nas suas relações externas.",e:[["O Presidente da Câmara representa a instituição apenas em juízo; as relações externas são da Mesa.","Representa a Câmara nas relações externas em geral."]]}
],
"2B · Presidente: sessões e atividades legislativas (Art. 27, I e II)":[
{a:"Art. 27, caput",t:"Ao Presidente da Câmara compete, privativamente: …",c:"As competências do Art. 27 são do Presidente da Câmara, de forma privativa.",e:[["As competências do Art. 27 são do Presidente da Câmara, concorrentes com a Mesa Diretora.","São privativas do Presidente."]]},
{a:"Art. 27, I, a e b",t:"a) presidi-las, suspendê-las ou prorrogá-las; b) determinar ao 2º Secretário a leitura da ata e, ao 1º Secretário, da pauta e das comunicações recebidas e expedidas pela Câmara.",c:"O Presidente determina ao 2º Secretário a leitura da ata e ao 1º Secretário a leitura da pauta e das comunicações.",e:[["O Presidente determina ao 1º Secretário a leitura da ata e ao 2º Secretário a leitura da pauta e das comunicações.","Estão trocados: ata é do 2º Secretário; pauta e comunicações, do 1º."]]},
{a:"Art. 27, I, c",t:"Determinar, de ofício ou a requerimento de qualquer Vereador, em qualquer fase dos trabalhos, a verificação de presença.",c:"O Presidente determina a verificação de presença em qualquer fase dos trabalhos, de ofício ou a requerimento de qualquer Vereador.",e:[["O Presidente só determina a verificação de presença a requerimento de Líder de bancada.","Pode ser de ofício ou a requerimento de qualquer Vereador."]]},
{a:"Art. 27, I, h",t:"Interromper o orador que se desviar da questão em debate ou falar sem o respeito devido à Câmara ou a qualquer de seus membros, advertindo-o e, em caso de insistência, cassando-lhe a palavra, podendo, ainda, suspender a sessão, quando não atendido e se as circunstâncias assim exigirem.",c:"Em caso de insistência do orador desviado do tema, o Presidente cassa-lhe a palavra e pode suspender a sessão se não for atendido.",e:[["Em caso de insistência do orador desviado do tema, o Presidente deve encerrar a sessão.","Cassa a palavra e, se necessário, suspende (não encerra) a sessão."]]},
{a:"Art. 27, I, k e m",t:"k) decidir sobre o impedimento de Vereador para votar; m) decidir as questões de ordem e as reclamações.",c:"Compete ao Presidente decidir sobre o impedimento de Vereador para votar.",e:[["Compete ao Plenário decidir sobre o impedimento de Vereador para votar.","É decisão do Presidente."]]},
{a:"Art. 27, I, o e p",t:"o) convocar as sessões da Câmara; p) presidir a sessão ou sessões de eleição da Mesa Diretora do segundo biênio ou de cargos vagos.",c:"O Presidente preside a sessão de eleição da Mesa do segundo biênio e a de cargos vagos.",e:[["A sessão de eleição da Mesa do segundo biênio é presidida pelo Vereador mais idoso.","É presidida pelo Presidente da Câmara."]]},
{a:"Art. 27, I, q",t:"Comunicar ao Plenário a declaração da extinção ou perda do mandato do Prefeito, Vice-Prefeito ou de Vereador, na primeira sessão subsequente à apuração do fato, fazendo constar em ata, convocando o suplente no caso de extinção de mandato de Vereador.",c:"O Presidente comunica ao Plenário a extinção ou perda de mandato na primeira sessão subsequente à apuração do fato.",e:[["O Presidente comunica ao Plenário a extinção ou perda de mandato na segunda sessão subsequente à apuração do fato.","É na primeira sessão subsequente."]]},
{a:"Art. 27, I, r",t:"Votar na eleição da Mesa Diretora, em casos de desempate e quando o voto for decisivo para que a matéria atinja o quórum necessário para sua aprovação.",c:"O Presidente vota na eleição da Mesa, nos desempates e quando seu voto for decisivo para atingir o quórum de aprovação.",e:[["O Presidente vota em todas as matérias, como qualquer Vereador.","Vota na eleição da Mesa, em desempates e quando decisivo para o quórum."]]},
{a:"Art. 27, II, a e b",t:"a) incluir em pauta de sessão ordinária, para a leitura do teor do texto e da exposição de motivos, qualquer projeto recebido, antes de remetê-lo às Comissões Permanentes; b) determinar a distribuição de matéria às Comissões Permanentes ou Temporárias, após sua leitura em Plenário.",c:"O Presidente inclui qualquer projeto recebido em pauta para leitura antes de remetê-lo às Comissões Permanentes.",e:[["O Presidente remete o projeto às Comissões Permanentes antes de sua leitura em pauta.","A leitura em pauta vem antes do envio às Comissões."]]},
{a:"Art. 27, II, c",t:"Deferir, por pedido escrito do autor, a retirada de proposição, mesmo que incluída na Ordem do Dia, nos termos que dispuser o Regimento.",c:"O Presidente defere, por pedido escrito do autor, a retirada de proposição, mesmo que incluída na Ordem do Dia, nos termos do Regimento.",e:[["O Presidente só defere a retirada de proposição se ainda não incluída na Ordem do Dia.","Pode ser deferida mesmo se já incluída, nos termos do Regimento."]]},
{a:"Art. 27, II, f",t:"Determinar que se devolva ao autor, antes do protocolo, a proposição que não esteja devidamente formalizada, que verse sobre matéria alheia à competência da Câmara, ou que seja evidentemente inconstitucional ou antirregimental.",c:"O Presidente determina a devolução ao autor, antes do protocolo, da proposição evidentemente inconstitucional ou antirregimental.",e:[["O Presidente submete ao Plenário a proposição evidentemente inconstitucional, antes do protocolo.","Determina a devolução ao autor, antes do protocolo."]]},
{a:"Art. 27, II, g",t:"Recusar o recebimento de substitutivos ou emendas que não sejam pertinentes à proposição inicial, determinando o devido arquivamento.",c:"O Presidente recusa substitutivos e emendas não pertinentes à proposição inicial, determinando o arquivamento.",e:[["O Presidente recusa substitutivos e emendas não pertinentes, devolvendo-os ao autor para nova redação.","Determina o arquivamento."]]},
{a:"Art. 27, II, i",t:"Incluir na Ordem do Dia da primeira sessão subsequente, sempre que tenha sido esgotado o prazo previsto para sua apreciação, os projetos de lei de iniciativa do Executivo submetidos à urgência, e os vetos, ficando sobrestadas as demais proposições até que se ultime a votação.",c:"Esgotado o prazo, o Presidente inclui na Ordem do Dia da primeira sessão subsequente os projetos do Executivo em urgência e os vetos, sobrestando as demais proposições.",e:[["Esgotado o prazo, o Presidente inclui os projetos do Executivo em urgência na Ordem do Dia da sessão seguinte, sem sobrestar as demais proposições.","As demais proposições ficam sobrestadas até a votação."]]},
{a:"Art. 27, II, j",t:"Expedir os autógrafos aos projetos de lei destinados à sanção e promulgação pelo Chefe do Executivo, podendo delegar ao 1º Secretário.",c:"O Presidente expede os autógrafos dos projetos de lei, podendo delegar ao 1º Secretário.",e:[["O Presidente expede os autógrafos dos projetos de lei, podendo delegar ao 2º Secretário.","A delegação é ao 1º Secretário."]]},
{a:"Art. 27, II, k",t:"Promulgar as Resoluções e os Decretos Legislativos, bem como as Leis com sanção tácita ou cujo veto tenha sido rejeitado pelo Plenário.",c:"O Presidente promulga as Resoluções, os Decretos Legislativos e as leis com sanção tácita ou veto rejeitado.",e:[["O Presidente promulga todas as leis aprovadas pela Câmara, independentemente de sanção do Prefeito.","Só as de sanção tácita ou veto rejeitado; as demais são sancionadas e promulgadas pelo Prefeito."]]}
],
"2C · Presidente: competência geral, Mesa, Comissões, administração e polícia (Art. 27, III a IX)":[
{a:"Art. 27, III, a",t:"Substituir o Prefeito ou sucedê-lo na falta deste e do Vice-Prefeito, completando, se for o caso, o seu mandato ou até que se realizem novas eleições.",c:"O Presidente da Câmara substitui ou sucede o Prefeito na falta deste e do Vice-Prefeito.",e:[["O Presidente da Câmara substitui o Prefeito na falta deste, antes mesmo do Vice-Prefeito.","Só na falta do Prefeito e do Vice-Prefeito."]]},
{a:"Art. 27, III, c",t:"Dar posse ao Prefeito, Vice-Prefeito e Vereadores e Vereadoras que não foram empossados no primeiro dia da legislatura, bem como aos suplentes de Vereadores.",c:"O Presidente dá posse aos suplentes de Vereadores e aos eleitos que não foram empossados no primeiro dia da legislatura.",e:[["O Plenário dá posse aos suplentes de Vereadores, por votação nominal.","A posse é dada pelo Presidente."]]},
{a:"Art. 27, III, d e e",t:"d) Declarar extinto o mandato do Prefeito, Vice-Prefeito, Vereadores e Vereadoras nos casos previstos em lei; e) Expedir Decreto Legislativo de cassação de mandato de Prefeito e Resolução de cassação de mandato de Vereador.",c:"O Presidente expede Decreto Legislativo para cassar o Prefeito e Resolução para cassar Vereador.",e:[["O Presidente expede Resolução para cassar o Prefeito e Decreto Legislativo para cassar Vereador.","Prefeito: Decreto Legislativo. Vereador: Resolução."]]},
{a:"Art. 27, III, f",t:"Declarar a vacância do cargo de Prefeito, nos termos da Lei.",c:"Compete ao Presidente declarar a vacância do cargo de Prefeito, nos termos da lei.",e:[["Compete ao Plenário, por 2/3, declarar a vacância do cargo de Prefeito.","Nos termos deste inciso, é o Presidente quem declara."]]},
{a:"Art. 27, III, g e h",t:"g) Não permitir a publicação de pronunciamentos ou expressões atentatórias ao decoro parlamentar; h) Zelar pelo prestígio e decoro da Câmara, bem como pela dignidade e respeito às prerrogativas constitucionais de seus membros.",c:"O Presidente não permite a publicação de pronunciamentos ou expressões atentatórias ao decoro parlamentar.",e:[["O Presidente publica todos os pronunciamentos e deixa ao Plenário a apuração de eventual quebra de decoro.","Ele não permite a publicação dos atentatórios ao decoro."]]},
{a:"Art. 27, III, i",t:"Autorizar a realização de eventos culturais ou artísticos no edifício da Câmara, fixando-lhes data, local e horário.",c:"O Presidente autoriza eventos culturais ou artísticos no edifício da Câmara, fixando data, local e horário.",e:[["A Mesa Diretora, por maioria, autoriza eventos culturais ou artísticos no edifício da Câmara.","A autorização é do Presidente."]]},
{a:"Art. 27, III, k",t:"Expedir Decreto Legislativo autorizando referendo ou convocando plebiscito.",c:"O Presidente expede Decreto Legislativo autorizando referendo ou convocando plebiscito.",e:[["O Presidente expede Resolução autorizando referendo ou convocando plebiscito.","O instrumento é o Decreto Legislativo."]]},
{a:"Art. 27, III, l",t:"Mandar publicar os pareceres do Tribunal de Contas sobre as contas do Prefeito e da Mesa da Câmara, com as respectivas decisões do Plenário, sendo estas remetidas, a seguir, aos Tribunais de Contas da União e do Estado.",c:"As decisões do Plenário sobre as contas são remetidas aos Tribunais de Contas da União e do Estado.",e:[["As decisões do Plenário sobre as contas são remetidas ao Ministério Público e à Procuradoria Regional Eleitoral.","Vão aos Tribunais de Contas da União e do Estado."]]},
{a:"Art. 27, IV",t:"Quanto às atividades da Mesa Diretora: a) convocar reuniões e presidi-las; b) tornar-se parte nas discussões e deliberações, com direito a voto; c) distribuir a matéria que dependa de parecer; d) executar as decisões da Mesa Diretora.",c:"Nas reuniões da Mesa, o Presidente toma parte nas discussões e deliberações, com direito a voto.",e:[["Nas reuniões da Mesa, o Presidente toma parte nas discussões, mas vota apenas em caso de empate.","Tem direito a voto."]]},
{a:"Art. 27, V, a e b",t:"Quanto às Comissões: a) designar seus membros titulares e suplentes mediante comunicação dos Líderes dos Blocos Parlamentares; b) destituir membro da Comissão Permanente em razão de faltas injustificadas.",c:"O Presidente designa os membros das Comissões mediante comunicação dos Líderes e destitui membro de Comissão Permanente por faltas injustificadas.",e:[["O Presidente designa os membros das Comissões por livre escolha, independentemente da indicação dos Líderes.","A designação é mediante comunicação dos Líderes."]]},
{a:"Art. 27, V, d, e e f",t:"d) convidar o Relator ou outro membro de Comissão para esclarecimento de parecer; e) nomear os membros das Comissões Temporárias; f) preencher, por nomeação, as vagas verificadas nas Comissões Permanentes e Temporárias.",c:"O Presidente nomeia os membros das Comissões Temporárias e preenche, por nomeação, as vagas nas Comissões Permanentes e Temporárias.",e:[["O Plenário elege os membros das Comissões Temporárias e o Presidente preenche as vagas das Permanentes.","O Presidente nomeia os membros das Temporárias e preenche as vagas de ambas."]]},
{a:"Art. 27, VI, a",t:"Comunicar a cada Vereador, por escrito, com antecedência mínima de 24 horas, a convocação de sessões extraordinárias no período normal de funcionamento ou durante o recesso, excetuando-se os casos de convocação durante sessão plenária deliberativa.",c:"O Presidente comunica por escrito a cada Vereador, com 24 horas de antecedência, a convocação de sessão extraordinária, salvo se convocada durante sessão plenária.",e:[["O Presidente comunica por escrito a cada Vereador, com 48 horas de antecedência, a convocação de sessão extraordinária.","A antecedência mínima é de 24 horas."],["A comunicação escrita com 24 horas é exigida mesmo quando a sessão extraordinária é convocada durante sessão plenária deliberativa.","Nesse caso a exigência é dispensada."]]},
{a:"Art. 27, VI, d e e",t:"d) dar ciência ao Plenário do relatório apresentado por Comissão Especial de Inquérito; e) remeter ao Prefeito, quando se tratar de fato relativo ao Poder Executivo, e ao Ministério Público, cópia do inteiro teor do relatório, após votado em Plenário, quando ela concluir pela existência de infração.",c:"O Presidente remete ao Ministério Público cópia do relatório da CEI, após votado em Plenário, quando concluir pela existência de infração.",e:[["O Presidente remete ao Ministério Público cópia do relatório da CEI antes de votado em Plenário.","A remessa é após a votação em Plenário."]]},
{a:"Art. 27, VI, f",t:"Organizar a Ordem do Dia, no mínimo 24 (vinte e quatro) horas antes da sessão respectiva, fazendo dela constar obrigatoriamente, com ou sem parecer das Comissões e antes do término do prazo, os projetos de lei com prazo de apreciação, bem como os projetos e o veto de que tratam os arts. 64, §2º, e 66, §6º, da Constituição Federal.",c:"O Presidente organiza a Ordem do Dia no mínimo 24 horas antes da sessão.",e:[["O Presidente organiza a Ordem do Dia no mínimo 48 horas antes da sessão.","São 24 horas."],["Projetos com prazo de apreciação só entram na Ordem do Dia se tiverem parecer das Comissões.","Entram obrigatoriamente, com ou sem parecer."]]},
{a:"Art. 27, VI, g e h",t:"g) executar as deliberações do Plenário; h) assinar a ata das sessões, os editais, as portarias e o expediente da Câmara.",c:"O Presidente executa as deliberações do Plenário e assina a ata das sessões, os editais, as portarias e o expediente.",e:[["O 1º Secretário assina isoladamente a ata das sessões, os editais e as portarias da Câmara.","Quem assina é o Presidente."]]},
{a:"Art. 27, VII, a",t:"Admitir, remover e readmitir funcionários da Câmara, conceder-lhes férias, abono de faltas e licenças especiais.",c:"Compete ao Presidente admitir, remover e readmitir funcionários da Câmara e conceder-lhes férias, abono de faltas e licenças especiais.",e:[["Compete à Mesa Diretora admitir, remover e readmitir funcionários da Câmara.","Quanto aos serviços, a competência é do Presidente."]]},
{a:"Art. 27, VII, b e c",t:"b) superintender o serviço administrativo da Câmara, autorizar nos limites do orçamento as suas despesas e requisitar o numerário ao Executivo; c) apresentar ao Plenário o balancete relativo às verbas recebidas e às despesas realizadas, no mesmo prazo observado em relação ao Tribunal de Contas do Estado.",c:"O Presidente autoriza as despesas da Câmara nos limites do orçamento e requisita o numerário ao Executivo.",e:[["O Presidente autoriza as despesas da Câmara mesmo acima dos limites do orçamento, se houver urgência.","A autorização é nos limites do orçamento."]]},
{a:"Art. 27, VII, d e e",t:"d) proceder às licitações para compras, obras e serviços da Câmara, obedecida a legislação pertinente; e) fazer, ao fim de sua gestão, relatório dos trabalhos da Câmara.",c:"O Presidente procede às licitações para compras, obras e serviços da Câmara e faz, ao fim de sua gestão, relatório dos trabalhos.",e:[["O Presidente faz, ao fim de cada sessão legislativa, relatório dos trabalhos da Câmara.","O relatório é ao fim de sua gestão."]]},
{a:"Art. 27, VIII, a e b",t:"a) conceder audiências públicas na Câmara em dias e horários pré-fixados; b) manter, em nome da Câmara, todos os contatos com o Prefeito e demais autoridades.",c:"O Presidente concede audiências públicas na Câmara em dias e horários pré-fixados.",e:[["O Presidente concede audiências públicas na Câmara a qualquer dia e hora, mediante requerimento.","Em dias e horários pré-fixados."]]},
{a:"Art. 27, VIII, d",t:"Contratar advogado para a propositura de ações judiciais e para defesa nas ações que forem movidas contra a Câmara ou contra ato da Mesa ou da Presidência.",c:"O Presidente contrata advogado para propor ações e para defesa nas ações movidas contra a Câmara, a Mesa ou a Presidência.",e:[["Compete ao Plenário, por maioria absoluta, contratar advogado para defesa da Câmara.","Compete ao Presidente."]]},
{a:"Art. 27, VIII, e e f",t:"e) solicitar a intervenção no Município nos casos admitidos pela Constituição Estadual; f) interpelar judicialmente o Prefeito, quando este deixar de colocar à disposição da Câmara, no prazo legal, as quantias requisitadas ou a parcela correspondente ao duodécimo das dotações orçamentárias.",c:"O Presidente interpela judicialmente o Prefeito que não coloca à disposição da Câmara, no prazo legal, as quantias requisitadas ou o duodécimo.",e:[["O Presidente notifica o Tribunal de Contas quando o Prefeito deixa de repassar o duodécimo.","A medida é a interpelação judicial do Prefeito."]]},
{a:"Art. 27, VIII, g",t:"Celebrar convênios específicos e firmar com entidades públicas, privadas ou órgãos financeiros contratos de consignação e de consolidação de dívidas do Poder Legislativo.",c:"O Presidente celebra convênios específicos e firma contratos de consignação e de consolidação de dívidas do Poder Legislativo.",e:[["Os convênios e contratos de consolidação de dívidas do Legislativo exigem aprovação do Plenário por maioria absoluta.","Compete ao Presidente celebrá-los e firmá-los."]]},
{a:"Art. 27, IX, a a c",t:"a) policiar o recinto da Câmara com o auxílio de seus funcionários, podendo requisitar elementos de corporações civis ou militares; b) permitir que qualquer cidadão assista às sessões, desde que não porte armas, não se manifeste de maneira desrespeitosa ou excessiva em apoio ou desaprovação ao que se passa no Plenário, não interpele os Vereadores; c) obrigar a se retirarem do recinto, sem prejuízo de outras medidas, os que não observarem esses deveres.",c:"O Presidente permite que qualquer cidadão assista às sessões, desde que não porte armas nem interpele os Vereadores.",e:[["Só podem assistir às sessões cidadãos previamente credenciados pelo Presidente.","Qualquer cidadão pode assistir, desde que cumpra os deveres do artigo."]]},
{a:"Art. 27, IX, d e e",t:"d) efetuar, se no recinto da Câmara for cometida qualquer infração penal, a prisão em flagrante, apresentando o infrator à autoridade competente; e) comunicar, se não houver flagrante, o fato à autoridade policial competente, para a instauração de inquérito.",c:"Se não houver flagrante, o Presidente comunica o fato à autoridade policial, para instauração de inquérito.",e:[["Se não houver flagrante, o Presidente instaura inquérito policial pela própria Câmara.","Comunica à autoridade policial, que instaura o inquérito."]]},
{a:"Art. 27, IX, f e g",t:"f) admitir no recinto do Plenário e em outras dependências da Câmara, a seu critério, somente a presença dos Vereadores e de funcionários quando em serviço; g) credenciar representantes de cada órgão da imprensa escrita, falada ou televisada que o solicitar, para a cobertura jornalística das sessões.",c:"O Presidente credencia representantes de cada órgão da imprensa que o solicitar, para a cobertura jornalística das sessões.",e:[["O Presidente credencia apenas um representante da imprensa por sessão, em rodízio.","Credencia representantes de cada órgão da imprensa que o solicitar."]]},
{a:"Art. 27, p. único",t:"O Presidente poderá delegar ao Vice-Presidente competência que lhe seja própria.",c:"O Presidente pode delegar ao Vice-Presidente competência que lhe seja própria.",e:[["O Presidente pode delegar ao 1º Secretário qualquer competência que lhe seja própria.","A delegação é ao Vice-Presidente (os autógrafos, em regra específica, ao 1º Secretário)."]]}
],
"2D · Presidente na tribuna, atos, Vices, Secretários, delegação e contas (Arts. 28-38)":[
{a:"Art. 28",t:"Quando o Presidente estiver com a palavra no exercício de suas funções, durante as sessões plenárias, não poderá ser interrompido nem aparteado.",c:"O Presidente, com a palavra no exercício de suas funções durante as sessões plenárias, não pode ser interrompido nem aparteado.",e:[["O Presidente, com a palavra durante as sessões plenárias, pode ser aparteado, mas não interrompido.","Não pode ser interrompido nem aparteado."]]},
{a:"Art. 29",t:"Será sempre computada, para efeito de quórum, a presença do Presidente nos trabalhos.",c:"A presença do Presidente é sempre computada para efeito de quórum.",e:[["A presença do Presidente só é computada para quórum quando ele estiver presidindo a sessão.","É sempre computada."]]},
{a:"Art. 30",t:"O Presidente não poderá fazer parte de qualquer Comissão, ressalvadas as de representação.",c:"O Presidente não pode fazer parte de qualquer Comissão, ressalvadas as de representação.",e:[["O Presidente não pode fazer parte de qualquer Comissão, ressalvadas as Comissões Especiais de Inquérito.","A ressalva é só para as Comissões de representação."],["O Presidente pode fazer parte das Comissões Permanentes, mas não das Temporárias.","Não integra nenhuma Comissão, salvo as de representação."]]},
{a:"Art. 31",t:"Nenhum membro da Mesa Diretora ou Vereador poderá presidir a sessão durante a discussão e votação de matérias de sua autoria.",c:"Nenhum membro da Mesa ou Vereador pode presidir a sessão durante a discussão e votação de matéria de sua autoria.",e:[["Nenhum membro da Mesa ou Vereador pode presidir a sessão durante a votação, mas pode presidir a discussão de matéria de sua autoria.","A vedação abrange a discussão e a votação."]]},
{a:"Art. 32, I",t:"Os atos do Presidente observarão a forma de ato numerado, em ordem cronológica, com renovação a cada ano da legislatura, nos casos de: a) regulamentação dos serviços administrativos; b) nomeação de membros das Comissões Permanentes e Temporárias; c) matérias de caráter financeiro; d) designação de substitutos nas Comissões; e) outras matérias de competência da Presidência que não sejam Portaria.",c:"A nomeação de membros das Comissões Permanentes e Temporárias é feita por ato numerado do Presidente.",e:[["A nomeação de membros das Comissões Permanentes e Temporárias é feita por portaria do Presidente.","É por ato numerado."],["Os atos e portarias do Presidente são numerados em ordem cronológica, com renovação a cada legislatura.","A renovação é a cada ano da legislatura."]]},
{a:"Art. 32, II",t:"Portaria numerada, em ordem cronológica, nos casos de: a) admissão, remoção, readmissão, férias, abono de faltas, concessão de licenças especiais ou expedição de determinações aos servidores da Câmara; b) outros casos determinados em Lei ou Resolução.",c:"A concessão de férias e de licenças especiais a servidores da Câmara é feita por portaria.",e:[["A concessão de férias e de licenças especiais a servidores da Câmara é feita por ato numerado.","É por portaria."],["A regulamentação dos serviços administrativos da Câmara é feita por portaria.","É por ato numerado (portaria é para atos funcionais dos servidores)."]]},
{a:"Art. 33",t:"O 1º Vice-presidente, salvo o disposto no art. 35 e nas hipóteses de atuação como membro efetivo da Mesa Diretora e nos casos de competência privativa deste órgão, não possui atribuições próprias, limitando-se a substituir o Presidente nas suas faltas e impedimentos.",c:"O 1º Vice-Presidente não possui atribuições próprias, limitando-se a substituir o Presidente nas suas faltas e impedimentos.",e:[["O 1º Vice-Presidente possui atribuições próprias, além de substituir o Presidente nas faltas e impedimentos.","Em regra, só substitui o Presidente."]]},
{a:"Art. 34, caput",t:"O 1º Vice-presidente promulgará e fará publicar as resoluções e decretos legislativos sempre que o Presidente, ainda que se ache em exercício, deixar de fazê-lo dentro do prazo legal e, este não o fazendo, caberá ao 2º Vice-presidente.",c:"Se o Presidente não promulgar resoluções e decretos legislativos no prazo legal, o 1º Vice-Presidente os promulga e, se este não o fizer, o 2º Vice-Presidente.",e:[["Se o Presidente não promulgar resoluções e decretos legislativos no prazo legal, a promulgação cabe ao 1º Secretário.","A ordem é 1º Vice e, depois, 2º Vice."],["O 1º Vice-Presidente só promulga resoluções e decretos legislativos quando o Presidente estiver ausente.","Promulga também quando o Presidente, ainda que em exercício, deixa de fazê-lo no prazo."]]},
{a:"Art. 34, p. único",t:"O disposto neste artigo aplica-se às leis municipais, quando o Prefeito e o Presidente da Câmara, sucessivamente, tenham deixado precluir a oportunidade de sua promulgação e publicação subsequente.",c:"Para as leis municipais, a sucessão (Prefeito, Presidente, Vice-Presidente) ocorre quando Prefeito e Presidente deixam precluir a promulgação e a publicação.",e:[["A promulgação supletiva pelos Vice-Presidentes só se aplica a resoluções e decretos legislativos, nunca a leis municipais.","Aplica-se também às leis municipais."]]},
{a:"Art. 35, I",t:"Compete ao 1º Secretário, durante as sessões plenárias, organizar as inscrições dos oradores no Pequeno e Grande Expediente e fazer a leitura das matérias constantes em pauta para a Ordem do Dia.",c:"O 1º Secretário organiza as inscrições dos oradores no Pequeno e Grande Expediente e lê as matérias da pauta da Ordem do Dia.",e:[["O 2º Secretário organiza as inscrições dos oradores no Pequeno e Grande Expediente.","É do 1º Secretário."]]},
{a:"Art. 35, II e III",t:"II - fazer a chamada dos Vereadores ao abrir-se a sessão e nas ocasiões determinadas pelo Presidente, anotando os comparecimentos e as ausências; III - ler as proposições e demais papéis que devam ser do conhecimento da Câmara.",c:"O 1º Secretário faz a chamada dos Vereadores ao abrir-se a sessão e nas ocasiões determinadas pelo Presidente.",e:[["O 1º Secretário faz a chamada dos Vereadores apenas ao abrir-se a sessão.","Também nas ocasiões determinadas pelo Presidente."]]},
{a:"Art. 35, IV a VII",t:"IV - gerir a correspondência da Diretoria Legislativa, providenciando a expedição de ofícios referentes às proposições deliberadas em plenário; V - coadjuvar o Presidente na direção dos serviços auxiliares; VI - certificar frequência dos Vereadores e Vereadoras; VII - manter à disposição do Plenário os textos legislativos de manuseio mais frequente.",c:"O 1º Secretário gere a correspondência da Diretoria Legislativa e certifica a frequência dos Vereadores.",e:[["O 2º Secretário certifica a frequência dos Vereadores e Vereadoras.","Certificar frequência é do 1º Secretário."]]},
{a:"Art. 35, VIII e IX",t:"VIII - exercer todas as atribuições administrativas delegadas e que não estejam reservadas à Mesa Diretora ou ao Presidente; IX - comunicar a todos os Vereadores e Vereadoras em exercício, no prazo de vinte e quatro horas após o protocolo, o recebimento de matérias de iniciativa do Poder Executivo.",c:"O 1º Secretário comunica a todos os Vereadores, em 24 horas após o protocolo, o recebimento de matérias de iniciativa do Executivo.",e:[["O 1º Secretário comunica a todos os Vereadores, em 48 horas após o protocolo, o recebimento de matérias do Executivo.","O prazo é de 24 horas."],["O 1º Secretário comunica a todos os Vereadores, em 24 horas, o recebimento de qualquer proposição protocolada.","A comunicação é das matérias de iniciativa do Poder Executivo."]]},
{a:"Art. 36, I",t:"Ao 2º Secretário compete substituir o 1º Secretário em suas faltas, ausências, impedimentos ou licenças, ficando, nas duas últimas hipóteses, investido na plenitude das respectivas funções.",c:"O 2º Secretário substitui o 1º e, nos casos de impedimentos ou licenças, fica investido na plenitude das funções.",e:[["O 2º Secretário substitui o 1º e fica investido na plenitude das funções em qualquer falta ou ausência.","A plenitude vale só para impedimentos e licenças (as duas últimas hipóteses)."]]},
{a:"Art. 36, II",t:"Responsabilizar-se pelos serviços de elaboração das atas de sessões ordinárias, extraordinárias e audiências públicas, conferindo-lhes publicidade e disponibilidade em sistema eletrônico institucional.",c:"O 2º Secretário responsabiliza-se pela elaboração das atas de sessões ordinárias, extraordinárias e audiências públicas.",e:[["O 1º Secretário responsabiliza-se pela elaboração das atas das sessões ordinárias, extraordinárias e audiências públicas.","A elaboração das atas é do 2º Secretário."],["O 2º Secretário elabora as atas das sessões ordinárias, extraordinárias e solenes.","São ordinárias, extraordinárias e audiências públicas (não solenes)."]]},
{a:"Art. 36, III",t:"Acompanhar o registro dos precedentes firmados para futura aplicação em eventuais casos análogos.",c:"O 2º Secretário acompanha o registro dos precedentes firmados, para futura aplicação em casos análogos.",e:[["O 1º Secretário acompanha o registro dos precedentes firmados, para futura aplicação em casos análogos.","É do 2º Secretário."]]},
{a:"Art. 37, caput e §1º",t:"A delegação de competência será utilizada como instrumento de descentralização administrativa. É facultado à Mesa Diretora, a qualquer de seus membros e às demais autoridades responsáveis pelos serviços administrativos da Câmara delegar competência para a prática de atos administrativos.",c:"A Mesa, qualquer de seus membros e as demais autoridades responsáveis pelos serviços administrativos podem delegar competência para a prática de atos administrativos.",e:[["Só o Presidente da Câmara pode delegar competência para a prática de atos administrativos.","Também a Mesa, qualquer de seus membros e as demais autoridades responsáveis pelos serviços administrativos."]]},
{a:"Art. 37, §2º",t:"O ato de delegação identificará precisamente a autoridade delegante, a autoridade delegada e as atribuições objeto da delegação.",c:"O ato de delegação identifica precisamente a autoridade delegante, a delegada e as atribuições delegadas.",e:[["O ato de delegação identifica a autoridade delegada e o prazo da delegação, dispensada a indicação do delegante.","Identifica o delegante, o delegado e as atribuições."]]},
{a:"Art. 38, I",t:"As contas da Mesa Diretora compor-se-ão de balancetes mensais, relativos às verbas recebidas e aplicadas, que deverão ser apresentados ao Plenário pelo Presidente, no mesmo prazo observado em relação ao Tribunal de Contas do Estado.",c:"Os balancetes mensais da Mesa são apresentados ao Plenário pelo Presidente, no mesmo prazo observado em relação ao Tribunal de Contas do Estado.",e:[["Os balancetes mensais da Mesa são apresentados ao Plenário pelo 1º Secretário.","Quem apresenta é o Presidente."],["Os balancetes da Mesa são apresentados ao Plenário trimestralmente.","São balancetes mensais."]]},
{a:"Art. 38, II",t:"Balanço geral anual, que deverá ser encaminhado ao Tribunal de Contas do Estado do Rio Grande do Norte ou órgão a que for atribuída tal competência.",c:"O balanço geral anual da Mesa é encaminhado ao Tribunal de Contas do Estado do Rio Grande do Norte.",e:[["O balanço geral anual da Mesa é encaminhado ao Tribunal de Contas da União.","É encaminhado ao Tribunal de Contas do Estado do RN."]]}
],
"3A · Substituição, extinção e destituição da Mesa (Arts. 39-51)":[
{a:"Art. 39",t:"Em suas faltas ou impedimentos durante as sessões plenárias, o Presidente da Mesa Diretora será substituído pelo 1º Vice-presidente e, estando este ausente, pelo 2º Vice-presidente. Não estando presentes ambos, substituirão o Presidente, sucessivamente, o 1º e o 2º Secretários.",c:"Ausentes o Presidente e os dois Vice-Presidentes, substituem o Presidente, sucessivamente, o 1º e o 2º Secretários.",e:[["Ausente o Presidente, é substituído pelo 1º Secretário e, na falta deste, pelo 1º Vice-Presidente.","A ordem é 1º Vice, 2º Vice, 1º Secretário e 2º Secretário."]]},
{a:"Art. 40",t:"Ausentes do Plenário os Secretários, o Presidente convidará qualquer Vereador(a) para a substituição em caráter eventual.",c:"Ausentes os Secretários, o Presidente convida qualquer Vereador para substituí-los em caráter eventual.",e:[["Ausentes os Secretários, a Mesa elege, por maioria, um Vereador para substituí-los em caráter eventual.","O Presidente convida qualquer Vereador."]]},
{a:"Art. 41",t:"Na hora determinada para o início da sessão, verificada a ausência dos membros da Mesa Diretora e de seus substitutos, assumirá a Presidência o Vereador mais idoso entre os presentes e, caso esta condição seja comum a dois ou mais Vereadores, o mais votado dentre eles.",c:"Ausentes os membros da Mesa e seus substitutos na hora da sessão, assume a Presidência o Vereador mais idoso entre os presentes; se a idade for igual, o mais votado.",e:[["Ausentes os membros da Mesa e seus substitutos na hora da sessão, assume a Presidência o Vereador mais votado; se houver empate, o mais idoso.","Primeiro a idade, depois o mais votado."],["Ausentes os membros da Mesa e seus substitutos, a sessão não pode ser aberta.","Assume a Presidência o Vereador mais idoso."]]},
{a:"Art. 41, p. único",t:"A Mesa Diretora, composta na forma deste artigo, dirigirá os trabalhos até o comparecimento de algum membro titular da Mesa Diretora ou de seus substitutos legais.",c:"A Mesa composta provisoriamente dirige os trabalhos até o comparecimento de algum membro titular da Mesa ou de seus substitutos legais.",e:[["A Mesa composta provisoriamente dirige os trabalhos até o fim da sessão, ainda que compareça membro titular.","Só até o comparecimento de algum titular ou substituto legal."]]},
{a:"Art. 42",t:"As funções dos membros da Mesa Diretora cessarão: I - pela posse da Mesa eleita para o mandato subsequente; II - pela renúncia, apresentada por escrito; III - pela destituição; IV - pela cassação ou extinção do mandato de Vereador; V - pela vacância do cargo ocasionada por outros motivos previstos neste Regimento.",c:"As funções de membro da Mesa cessam pela renúncia apresentada por escrito.",e:[["As funções de membro da Mesa cessam pela renúncia, apresentada por escrito ou verbalmente em Plenário.","A renúncia é apresentada por escrito."],["As funções de membro da Mesa cessam pela mudança de partido.","Mudança de partido não está entre as hipóteses do Art. 42."]]},
{a:"Art. 43, caput",t:"Vagando-se qualquer cargo da Mesa Diretora, será realizada eleição no Expediente da primeira sessão ordinária seguinte, ou em sessão extraordinária convocada para esse fim, para completar o mandato.",c:"Vagando-se cargo da Mesa, a eleição ocorre no Expediente da primeira sessão ordinária seguinte, ou em sessão extraordinária convocada para esse fim.",e:[["Vagando-se cargo da Mesa, a eleição ocorre na Ordem do Dia da primeira sessão ordinária seguinte.","É no Expediente."],["Vagando-se cargo da Mesa, o eleito cumpre novo mandato de dois anos.","Completa o mandato."]]},
{a:"Art. 43, p. único",t:"Em caso de renúncia ou destituição total da Mesa Diretora, proceder-se-á à nova eleição, para se completar o período do mandato, na sessão imediata àquela em que ocorreu a renúncia ou destituição, sob a presidência do Vereador mais idoso e, caso esta condição seja comum a dois ou mais Vereadores, do mais votado dentre eles, que ficará investido na plenitude das funções até a posse da nova Mesa.",c:"Na renúncia ou destituição total da Mesa, a nova eleição ocorre na sessão imediata, sob a presidência do Vereador mais idoso.",e:[["Na renúncia ou destituição total da Mesa, a nova eleição ocorre em até 30 dias, sob a presidência do Vereador mais votado.","Ocorre na sessão imediata, sob o mais idoso (desempate pelo mais votado)."]]},
{a:"Art. 44",t:"A renúncia do Vereador ao cargo que ocupa na Mesa Diretora dar-se-á por ofício a ela dirigido e efetivar-se-á, independentemente de deliberação do Plenário, a partir do momento em que for lido em sessão plenária.",c:"A renúncia ao cargo na Mesa efetiva-se, independentemente de deliberação do Plenário, a partir do momento em que o ofício for lido em sessão plenária.",e:[["A renúncia ao cargo na Mesa só se efetiva após aprovação do Plenário.","Independe de deliberação do Plenário."],["A renúncia ao cargo na Mesa efetiva-se no momento do protocolo do ofício.","Efetiva-se a partir da leitura em sessão plenária."]]},
{a:"Art. 45",t:"Em caso de renúncia total da Mesa Diretora, o ofício respectivo será levado ao conhecimento do Plenário pelo Vereador mais idoso e, em caso de empate, pelo mais votado dentre eles, que exercerá as funções de Presidente.",c:"Na renúncia total da Mesa, o ofício é levado ao Plenário pelo Vereador mais idoso, que exercerá as funções de Presidente.",e:[["Na renúncia total da Mesa, o ofício é levado ao Plenário pelo Vereador mais votado, que exercerá as funções de Presidente.","É o mais idoso (desempate: mais votado)."]]},
{a:"Art. 46, caput",t:"Os membros da Mesa Diretora, isoladamente ou em conjunto, poderão ser destituídos de seus cargos, mediante projeto de resolução aprovado por 2/3 (dois terços), no mínimo, dos membros da Câmara, assegurado o direito de ampla defesa.",c:"A destituição de membros da Mesa, isolada ou conjunta, é por projeto de resolução aprovado por 2/3 dos membros da Câmara.",e:[["A destituição de membros da Mesa é por decreto legislativo aprovado por 2/3 dos membros da Câmara.","O instrumento é projeto de resolução."],["A destituição de membros da Mesa é por projeto de resolução aprovado por maioria absoluta dos membros da Câmara.","O quórum é de 2/3."]]},
{a:"Art. 46, §§1º e 2º",t:"§1º É passível de destituição o membro da Mesa quando faltoso, omisso ou ineficiente, ou quando exorbite das atribuições. §2º Será destituído, sem necessidade da aprovação de que trata o caput, o membro que deixar de comparecer a 05 (cinco) reuniões ordinárias consecutivas, sem causa justificada, ou que tenha a destituição declarada por via judicial.",c:"O membro da Mesa que faltar a cinco reuniões ordinárias consecutivas, sem causa justificada, é destituído sem necessidade da aprovação de 2/3.",e:[["O membro da Mesa que faltar a cinco reuniões ordinárias consecutivas sem causa justificada só é destituído com aprovação de 2/3.","Nesse caso dispensa-se a aprovação de 2/3."]]},
{a:"Art. 47, caput",t:"O processo de destituição terá início por denúncia subscrita necessariamente por no mínimo dois Vereadores, dirigida ao Plenário e lida pelo seu autor em qualquer fase da sessão, independentemente de prévia inscrição ou autorização da Presidência.",c:"A denúncia de destituição é subscrita por no mínimo dois Vereadores e lida pelo seu autor em qualquer fase da sessão, sem prévia inscrição.",e:[["A denúncia de destituição é subscrita por no mínimo 1/3 dos Vereadores.","Bastam dois Vereadores."],["A denúncia de destituição é lida em qualquer fase da sessão, mediante prévia inscrição junto à Presidência.","Independe de prévia inscrição ou autorização."]]},
{a:"Art. 47, §1º",t:"Da denúncia constarão: I - O membro ou os membros da Mesa denunciados; II - descrição circunstanciada das irregularidades cometidas; III - as provas que se pretendam produzir.",c:"A denúncia de destituição deve conter os denunciados, a descrição circunstanciada das irregularidades e as provas que se pretendam produzir.",e:[["A denúncia de destituição deve conter os denunciados, a descrição circunstanciada das irregularidades e o rol de testemunhas, vedada a juntada de provas documentais.","Consta o que se pretenda produzir de provas, sem essa vedação."]]},
{a:"Art. 47, §§2º a 5º",t:"Lida a denúncia, será imediatamente submetida ao Plenário pelo Presidente, salvo se este for envolvido nas acusações, caso em que as providências competirão a seus substitutos legais e, se estes também forem envolvidos, ao Vereador mais idoso. O membro envolvido não poderá presidir nem secretariar os trabalhos quando estiver sendo discutido ou deliberado qualquer ato do processo.",c:"O membro da Mesa denunciado não pode presidir nem secretariar os trabalhos enquanto se discute ou delibera ato do processo de sua destituição.",e:[["O membro da Mesa denunciado não pode presidir, mas pode secretariar os trabalhos durante o processo de sua destituição.","Não pode presidir nem secretariar."]]},
{a:"Art. 47, §§6º e 7º",t:"§6º O denunciante e o denunciado são impedidos de deliberar sobre o recebimento da denúncia, não sendo necessária a convocação de suplente para esse ato. §7º Considerar-se-á recebida a denúncia se esta for aprovada pela maioria absoluta dos Vereadores.",c:"A denúncia contra membro da Mesa é considerada recebida se aprovada pela maioria absoluta dos Vereadores.",e:[["A denúncia contra membro da Mesa é considerada recebida se aprovada por 2/3 dos Vereadores.","O recebimento exige maioria absoluta (2/3 é a destituição)."],["Denunciante e denunciado votam o recebimento da denúncia, e é convocado suplente para o ato.","São impedidos de deliberar, sem convocação de suplente."]]},
{a:"Art. 48, caput e §1º",t:"Recebida a denúncia, serão sorteados 03 (três) Vereadores para compor a Comissão Processante. Da Comissão não poderão fazer parte o denunciante e o denunciado.",c:"Recebida a denúncia de destituição, são sorteados três Vereadores para a Comissão Processante, dela não podendo fazer parte denunciante e denunciado.",e:[["Recebida a denúncia de destituição, o Presidente nomeia cinco Vereadores para a Comissão Processante, respeitada a proporcionalidade.","São sorteados três Vereadores."]]},
{a:"Art. 48, §2º",t:"Constituída a Comissão Processante, seus membros elegerão um deles para Presidente, o qual nomeará entre seus pares um relator e marcará reunião a ser realizada dentro das 48 (quarenta e oito) horas seguintes.",c:"A Comissão Processante elege o Presidente, que nomeia o relator e marca reunião para dentro de 48 horas.",e:[["A Comissão Processante tem Presidente e relator escolhidos por sorteio, e a primeira reunião ocorre em 24 horas.","Elege o Presidente, que nomeia o relator; a reunião é em 48 horas."]]},
{a:"Art. 48, §§3º e 4º",t:"§3º O denunciado será notificado dentro de 03 (três) dias, a contar da primeira reunião da Comissão, para apresentação, por escrito, de defesa prévia, no prazo de 10 (dez) dias. §4º Findo o prazo, a Comissão, de posse ou não da defesa prévia, procederá às diligências necessárias, emitindo, no prazo de 20 (vinte) dias, seu parecer.",c:"O denunciado é notificado em três dias, a contar da primeira reunião da Comissão, para apresentar defesa prévia em dez dias.",e:[["O denunciado é notificado em dez dias, a contar da primeira reunião da Comissão, para apresentar defesa prévia em três dias.","Notificação em 3 dias; defesa prévia em 10."],["Findo o prazo da defesa prévia, a Comissão emite parecer em 30 dias.","O parecer é em 20 dias."]]},
{a:"Art. 49, caput e §1º",t:"Findo o prazo de 20 (vinte) dias e concluindo pela procedência das acusações, a Comissão deverá apresentar, na primeira sessão ordinária subsequente, Projeto de Resolução propondo a destituição. O Projeto será submetido à discussão e votação nominal única, desconsiderando-se para efeitos de quórum a presença do denunciado.",c:"Concluindo pela procedência, a Comissão apresenta Projeto de Resolução na primeira sessão ordinária subsequente, em discussão e votação nominal únicas.",e:[["Concluindo pela procedência, a Comissão apresenta Projeto de Resolução, votado em dois turnos de votação nominal.","A discussão e a votação nominal são únicas."],["Concluindo pela procedência, a Comissão apresenta Projeto de Decreto Legislativo propondo a destituição.","É Projeto de Resolução."]]},
{a:"Art. 49, §§2º e 3º",t:"Os Vereadores e o relator da Comissão Processante e o denunciado terão cada um 30 (trinta) minutos para a discussão do Projeto de Resolução, vedada a cessão de tempo. Terão preferência na ordem de inscrição, respectivamente, o relator da Comissão e o denunciado.",c:"Na discussão do projeto de destituição, cada Vereador, o relator e o denunciado têm 30 minutos, vedada a cessão de tempo.",e:[["Na discussão do projeto de destituição, cada Vereador tem 15 minutos, e relator e denunciado, 30 minutos.","Aqui todos têm 30 minutos (os 15 minutos são do Art. 50, §1º)."],["Na discussão do projeto de destituição, a cessão de tempo entre Vereadores é permitida.","A cessão é vedada."]]},
{a:"Art. 50, caput e §1º",t:"Concluindo pela improcedência das acusações, a Comissão Processante deverá apresentar seu parecer na primeira sessão ordinária subsequente, para ser lido, discutido e votado nominalmente em turno único, na fase da Ordem do Dia. Cada Vereador terá o prazo máximo de 15 (quinze) minutos para discutir o parecer, cabendo ao relator e ao denunciado o prazo de 30 (trinta) minutos.",c:"No parecer pela improcedência, cada Vereador tem no máximo 15 minutos para discutir, e o relator e o denunciado têm 30 minutos.",e:[["No parecer pela improcedência, cada Vereador tem 30 minutos para discutir, e o relator e o denunciado têm 15 minutos.","Vereador: 15 minutos. Relator e denunciado: 30."]]},
{a:"Art. 50, §3º",t:"O parecer da Comissão Processante será aprovado ou rejeitado por maioria simples, procedendo-se: a) ao arquivamento do processo, se aprovado o parecer; b) à remessa do processo à Comissão de Constituição, Justiça e Redação, se rejeitado o parecer.",c:"O parecer pela improcedência é votado por maioria simples; aprovado, o processo é arquivado.",e:[["O parecer pela improcedência é votado por maioria absoluta; aprovado, o processo é arquivado.","O quórum é maioria simples."],["Rejeitado o parecer pela improcedência, o processo é arquivado.","Rejeitado, vai à Comissão de Constituição, Justiça e Redação."]]},
{a:"Art. 50, §§2º e 4º",t:"§2º Não se concluindo nessa sessão a apreciação do parecer, a autoridade que estiver presidindo convocará sessões extraordinárias destinadas, integral e exclusivamente ao exame da matéria. §4º Ocorrendo a rejeição do parecer, a Comissão de Constituição, Justiça e Redação deverá elaborar, dentro de 3 (três) dias, Projeto de Resolução propondo a destituição.",c:"Rejeitado o parecer pela improcedência, a CCJR elabora, em três dias, Projeto de Resolução propondo a destituição.",e:[["Rejeitado o parecer pela improcedência, a CCJR elabora, em dez dias, Projeto de Resolução propondo a destituição.","O prazo é de três dias."]]},
{a:"Art. 51",t:"A aprovação do Projeto de Resolução pelo quórum de 2/3 (dois terços) implicará o imediato afastamento do denunciado, devendo a Resolução respectiva ser dada à publicação pela autoridade que estiver presidindo os trabalhos, dentro do prazo de 48 (quarenta e oito) horas, contado a partir da deliberação do Plenário.",c:"Aprovado o projeto de destituição por 2/3, o afastamento é imediato, e a Resolução é publicada em 48 horas, contadas da deliberação do Plenário.",e:[["Aprovado o projeto de destituição por 2/3, a Resolução é publicada em 72 horas.","O prazo é de 48 horas."],["Aprovado o projeto de destituição por maioria absoluta, o afastamento é imediato.","Exige 2/3."]]}
],
"3B · Plenário, quóruns, bancadas e lideranças (Arts. 52-66)":[
{a:"Art. 52",t:"O Plenário é o órgão deliberativo e soberano da Câmara Municipal, constituído pela reunião de Vereadores em exercício, em local, forma e número estabelecidos neste Regimento. §1º O local é o recinto de sua sede. §2º A forma legal para deliberar é a sessão. §3º O número é o quórum determinado em lei ou neste Regimento.",c:"O Plenário é o órgão deliberativo e soberano da Câmara; a forma legal para deliberar é a sessão.",e:[["O Plenário é o órgão deliberativo da Câmara, subordinado à Mesa Diretora; a forma legal para deliberar é a reunião.","É soberano, e a forma é a sessão."]]},
{a:"Art. 53, §§1º a 3º",t:"A maioria simples é a que representa o maior resultado de votação, dentre os presentes à reunião. A maioria absoluta é a que compreende mais da metade dos membros da Câmara. A maioria qualificada é a que atinge ou ultrapassa 2/3 (dois terços) dos membros da Câmara.",c:"A maioria absoluta é a que compreende mais da metade dos membros da Câmara.",e:[["A maioria absoluta é a que compreende mais da metade dos Vereadores presentes à reunião.","A base são os membros da Câmara."],["A maioria qualificada é a que atinge ou ultrapassa 3/5 dos membros da Câmara.","É 2/3."]]},
{a:"Art. 54, §1º, I a V",t:"O Plenário deliberará por maioria absoluta sobre: I. projetos de lei complementar; II. matéria tributária; III. Código de Obras e Edificações e outros códigos; IV. Estatuto dos Servidores Municipais; V. criação de cargos, funções e empregos da administração direta, autárquica e fundacional, bem como sua remuneração.",c:"Os projetos de lei complementar e a matéria tributária são deliberados por maioria absoluta.",e:[["Os projetos de lei complementar são deliberados por maioria qualificada (2/3).","É maioria absoluta."],["O Estatuto dos Servidores Municipais é deliberado por maioria simples.","É maioria absoluta."]]},
{a:"Art. 54, §1º, VI a X",t:"VI. concessão de serviço público; VII. concessão de direito real de uso; VIII. alienação de bens e imóveis; IX. autorização para obtenção de empréstimo de particular; X. lei de diretrizes orçamentárias, plano plurianual e lei orçamentária anual.",c:"A concessão de serviço público e a alienação de bens e imóveis são deliberadas por maioria absoluta.",e:[["A alienação de bens e imóveis é deliberada por maioria qualificada (2/3).","No Regimento é maioria absoluta (a Lei Orgânica, Art. 109, exige 2/3 para vender imóvel)."],["A lei orçamentária anual é deliberada por maioria simples.","LDO, PPA e LOA: maioria absoluta."]]},
{a:"Art. 54, §1º, XI a XVI",t:"XI. aquisição de bens imóveis por doação com encargo; XII. criação, estruturação e atribuições dos Órgãos de Assessoria de Descentralização Administrativa, de deliberação coletiva e de execução; XIII. operações de crédito para abertura de créditos adicionais, suplementares ou especiais com finalidade precisa; XIV. rejeição de veto; XV. isenções de impostos municipais; XVI. todo e qualquer tipo de anistia.",c:"A rejeição de veto, as isenções de impostos municipais e qualquer anistia exigem maioria absoluta.",e:[["A rejeição de veto exige maioria qualificada (2/3).","Exige maioria absoluta."],["Apenas a anistia tributária exige maioria absoluta; as demais anistias, maioria simples.","Todo e qualquer tipo de anistia exige maioria absoluta."]]},
{a:"Art. 54, §1º, XVII a XXI",t:"XVII. acolhimento de denúncia contra Vereador; XVIII. zoneamento urbano; XIX. plano diretor; XX. admissão de acusação contra Prefeito; XXI. concessão de título de cidadão honorário ou qualquer outra honraria ou homenagem.",c:"A admissão de acusação contra o Prefeito e o plano diretor são deliberados por maioria absoluta.",e:[["A concessão de título de cidadão honorário é deliberada por maioria qualificada (2/3).","É maioria absoluta."],["O acolhimento de denúncia contra Vereador é deliberado por maioria simples.","É maioria absoluta."]]},
{a:"Art. 54, §2º, I a IV",t:"Por maioria qualificada sobre: I - rejeição do parecer prévio do Tribunal de Contas do Estado; II - destituição dos membros da Mesa; III - emendas à Lei Orgânica; IV - alterações ao Regimento Interno da Câmara Municipal.",c:"A rejeição do parecer prévio do TCE, a destituição da Mesa, as emendas à Lei Orgânica e as alterações ao Regimento exigem maioria qualificada.",e:[["A rejeição do parecer prévio do Tribunal de Contas exige maioria absoluta.","Exige maioria qualificada (2/3)."],["As alterações ao Regimento Interno exigem maioria absoluta.","Exigem maioria qualificada (2/3)."]]},
{a:"Art. 54, §2º, V a VIII",t:"V - perda de mandato de Prefeito; VI - perda de mandato de Vereador; VII - criação, organização e supressão de distritos e subdistritos e divisão do território do município em áreas administrativas; VIII - alteração de denominação de próprios, vias e logradouros públicos.",c:"A perda de mandato de Prefeito ou de Vereador e a alteração de denominação de vias e logradouros exigem maioria qualificada.",e:[["A alteração de denominação de vias e logradouros públicos exige maioria absoluta.","Exige maioria qualificada (2/3)."],["A criação e a supressão de distritos exigem maioria absoluta.","Exigem maioria qualificada (2/3)."]]},
{a:"Art. 55",t:"As deliberações do Plenário dar-se-ão sempre por voto aberto.",c:"As deliberações do Plenário dão-se sempre por voto aberto.",e:[["As deliberações do Plenário dão-se por voto aberto, salvo as de perda de mandato, que são por voto secreto.","São sempre por voto aberto."]]},
{a:"Art. 56, caput e §1º",t:"As sessões da Câmara, exceto as solenes, que poderão ser realizadas em outro recinto, terão, obrigatoriamente, por local a sua sede, considerando-se nulas as que se realizarem fora dela. Por motivo de interesse público, devidamente justificado, as sessões poderão ser realizadas em outro recinto, designado em ato da Mesa publicado, no mínimo, 3 (três) dias antes.",c:"Por interesse público justificado, as sessões podem ocorrer em outro recinto, designado em ato da Mesa publicado no mínimo três dias antes.",e:[["Por interesse público justificado, as sessões podem ocorrer em outro recinto, designado em ato do Presidente publicado no mínimo 24 horas antes.","Ato da Mesa, no mínimo 3 dias antes."],["As sessões realizadas fora da sede são sempre válidas, desde que haja quórum.","São nulas, salvo as solenes e o caso do §1º."]]},
